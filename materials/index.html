<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materials — Larisel</title>
<meta name="description" content="Every cloth, stone, wood and metal Larisel furniture is made in — seen up close.">
<meta name="theme-color" content="#fdfbf7">
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/img/favicon.svg?v=2" type="image/svg+xml">
<link rel="preload" href="../fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../css/base.css?v=1">
<link rel="stylesheet" href="../css/store.css?v=3">
</head>
<body class="page">

<header class="site-head site-head--line" data-site-head></header>

<main>
  <section class="wrap page-hero">
    <p class="eyebrow-line" data-s="m.eyebrow"></p>
    <h1 data-s="m.title"></h1>
    <p data-s="m.lead"></p>
    <nav class="chips" data-s-aria="m.sections">
      <a class="chip" href="#sofa" data-s="m.sofa"></a>
      <a class="chip" href="#armchair" data-s="m.armchair"></a>
      <a class="chip" href="#table" data-s="m.table"></a>
      <a class="chip" href="#finishes" data-s="m.finishes"></a>
    </nav>
  </section>

  <div id="library"></div>

</main>

<!-- one material, near -->
<div class="sheet-lite" id="look" hidden>
  <div class="sheet-lite__veil" data-close></div>
  <div class="sheet-lite__card" role="dialog" aria-modal="true" aria-labelledby="look-title">
    <figure class="sheet-lite__pic"><img id="look-img" alt="" width="1400" height="900"></figure>
    <div class="sheet-lite__text">
      <p class="eyebrow-line" id="look-kind"></p>
      <h2 id="look-title"></h2>
      <p id="look-desc"></p>
      <a class="btn btn--solid" id="look-go" data-s="m.go"></a>
    </div>
    <button class="icon-btn sheet-lite__close" type="button" data-close data-s-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<footer class="site-foot" data-site-foot></footer>

<script type="module">
import * as store from '../js/store.js?v=3';
import { TYPES, PRODUCTS, FRAMES, frameSwatch } from '../js/catalog.js?v=2';

store.words({
  en: {
    'm.page': 'Materials', 'm.eyebrow': 'Materials', 'm.title': 'What it is made of, seen up close.',
    'm.lead': 'Every cloth, stone, wood and metal we make with — the same ones the pieces are shown in. Tap one to see it near, then design with it.',
    'm.sofa': 'Sofa cloths', 'm.armchair': 'Armchair bouclé', 'm.table': 'Table tops', 'm.finishes': 'Wood and metal',
    'm.sofaLead': 'Three cloths, eight tones in each. The scatter cushions come in any of them.',
    'm.armLead': 'A dense bouclé in twelve colours, chosen to sit together.',
    'm.tableLead': 'Five marbles, a travertine and two solid woods.',
    'm.finLead': 'Four woods and four metals, for the armchair’s frame, the sofa’s legs and the table’s base — so the pieces make a set.',
    'm.sections': 'Sections', 'm.near': 'See it near', 'm.go': 'Design with it', 'm.price': '+%s',
    'fin.wood': 'Solid wood, oiled', 'fin.metal': 'Steel with a metal finish', 'fin.desc': 'The frame, the legs or the base: the same finish on every piece, so they make a set.',
  },
  tr: {
    'm.page': 'Malzemeler', 'm.eyebrow': 'Malzemeler', 'm.title': 'Neyden yapıldığı, yakından.',
    'm.lead': 'Çalıştığımız her kumaş, taş, ahşap ve metal — ürünlerin gösterildiği malzemelerin ta kendisi. Yakından görmek için birine dokunun, sonra onunla tasarlayın.',
    'm.sofa': 'Kanepe kumaşları', 'm.armchair': 'Koltuk buklesi', 'm.table': 'Sehpa tablaları', 'm.finishes': 'Ahşap ve metal',
    'm.sofaLead': 'Üç kumaş, her birinde sekiz ton. Dekoratif yastıklar bunların herhangi birinden olabilir.',
    'm.armLead': 'Birbirine uyacak şekilde seçilmiş on iki renkte, sık dokulu bir bukle.',
    'm.tableLead': 'Beş mermer, bir traverten ve iki masif ahşap.',
    'm.finLead': 'Koltuğun iskeleti, kanepenin ayakları ve sehpanın kaidesi için dört ahşap, dört metal — böylece parçalar takım olur.',
    'm.sections': 'Bölümler', 'm.near': 'Yakından bak', 'm.go': 'Bununla tasarla', 'm.price': '+%s',
    'fin.wood': 'Masif ahşap, yağlı', 'fin.metal': 'Metal kaplamalı çelik', 'fin.desc': 'İskelet, ayaklar ya da kaide: her parçada aynı renk, böylece takım olurlar.',
  },
  ru: {
    'm.page': 'Материалы', 'm.eyebrow': 'Материалы', 'm.title': 'Из чего это сделано — крупным планом.',
    'm.lead': 'Все ткани, камни, дерево и металл, с которыми мы работаем, — те самые, в которых показаны изделия. Нажмите, чтобы рассмотреть, — и создайте с ним свой дизайн.',
    'm.sofa': 'Ткани для дивана', 'm.armchair': 'Букле для кресла', 'm.table': 'Столешницы', 'm.finishes': 'Дерево и металл',
    'm.sofaLead': 'Три ткани, по восемь оттенков. Декоративные подушки — в любой из них.',
    'm.armLead': 'Плотное букле в двенадцати цветах, подобранных друг к другу.',
    'm.tableLead': 'Пять мраморов, травертин и два массива дерева.',
    'm.finLead': 'Четыре породы дерева и четыре металла — для каркаса кресла, ножек дивана и основания столика, чтобы вещи составляли комплект.',
    'm.sections': 'Разделы', 'm.near': 'Рассмотреть', 'm.go': 'Создать дизайн с ним', 'm.price': '+%s',
    'fin.wood': 'Массив дерева, масло', 'fin.metal': 'Сталь с металлическим покрытием', 'fin.desc': 'Каркас, ножки или основание: одна отделка на всех вещах, чтобы они составляли комплект.',
  },
});
store.mount({ base: '../', page: 'materials' });

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const R = '../';

/* the library: every material once, with its family, its picture and the close-up where there is one */
const S = PRODUCTS.sofa, A = PRODUCTS.armchair, T = PRODUCTS.table;
const kindName = (f) => TYPES[f.type] ? TYPES[f.type].name : null;
const SECTIONS = [
  { id: 'sofa', title: 'm.sofa', lead: 'm.sofaLead', groups: S.types.map((ty) => ({ name: TYPES[ty].name, items: S.fabrics.filter((f) => f.type === ty) })),
    sw: (f) => R + S.fabricSwatch(f), macro: (f) => R + S.macroSrc(f), desc: (f) => TYPES[f.type].desc, kind: kindName, p: 'sofa' },
  { id: 'armchair', title: 'm.armchair', lead: 'm.armLead', groups: [{ name: null, items: A.fabrics }],
    sw: (f) => R + A.fabricSwatch(f), macro: (f) => R + A.macroSrc(f), desc: () => TYPES.boucle.desc, kind: () => TYPES.boucle.name, p: 'armchair' },
  { id: 'table', title: 'm.table', lead: 'm.tableLead', groups: [{ name: null, items: T.fabrics }],
    sw: (f) => R + T.fabricSwatch(f), macro: (f) => R + T.macroSrc(f), desc: (f) => TYPES[f.type].desc, kind: kindName, p: 'table' },
  { id: 'finishes', title: 'm.finishes', lead: 'm.finLead', groups: [{ name: null, items: FRAMES }],
    sw: (f) => R + frameSwatch(f), macro: null, desc: null, kind: (f) => null },
];
const keyOf = (sec, f) => sec.id + ':' + f.id;
const ALL = new Map();
SECTIONS.forEach((sec) => sec.groups.forEach((g) => g.items.forEach((f) => ALL.set(keyOf(sec, f), { sec, f }))));
const isMetal = (f) => ['nickel', 'brass', 'bronze', 'black'].includes(f.id);

function renderLibrary() { store.keepFocus($('library'), drawLibrary); }
function drawLibrary() {
  $('library').innerHTML = SECTIONS.map((sec) => `
    <section class="section lib" id="${sec.id}">
      <div class="wrap">
        <div class="section__head"><h2>${esc(store.t(sec.title))}</h2><p>${esc(store.t(sec.lead))}</p></div>
        ${sec.groups.map((g) => `
          ${g.name ? `<h3 class="lib__group">${esc(store.pick(g.name))}</h3>` : ''}
          <ul class="mats">${g.items.map((f) => `
            <li class="mat" data-k="${esc(keyOf(sec, f))}">
              <button class="mat__pic" type="button" ${sec.macro ? `data-look aria-label="${esc(store.t('m.near') + ': ' + store.pick(f.name))}"` : 'tabindex="-1" aria-hidden="true"'}><img src="${esc(sec.sw(f))}" alt="" width="96" height="96" loading="lazy" decoding="async"></button>
              <p class="mat__name">${esc(store.pick(f.name))}</p>
              <p class="mat__meta">${esc(sec.id === 'finishes' ? store.t(isMetal(f) ? 'fin.metal' : 'fin.wood') : f.price ? store.t('m.price').replace('%s', store.price(f.price)) : '')}</p>
            </li>`).join('')}</ul>`).join('')}
      </div>
    </section>`).join('');
  $('library').querySelectorAll('.mat [data-look]').forEach((b) => b.addEventListener('click', () => openLook(b.closest('.mat').dataset.k)));
}

/* one material, near: the close-up rendered on the piece itself */
let lookKey = '', lastFocus = null;
function openLook(k) {
  const { sec, f } = ALL.get(k);
  lookKey = k; lastFocus = k;
  $('look-img').src = sec.macro(f);
  $('look-img').alt = store.pick(f.name);
  fillLook();
  const el = $('look'); el.hidden = false;
  store.lock(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('is-open')));
  el.querySelector('.sheet-lite__close').focus({ preventScroll: true });
}
function fillLook() {
  if (!lookKey) return;
  const { sec, f } = ALL.get(lookKey);
  const kind = sec.kind(f);
  $('look-kind').textContent = kind ? store.pick(kind) : '';
  $('look-title').textContent = store.pick(f.name);
  $('look-desc').textContent = sec.desc ? store.pick(sec.desc(f)) : store.t('fin.desc');
  /* the configurator opens on this piece, dressed in this material */
  $('look-go').href = R + '?' + new URLSearchParams({ p: sec.p, fab: f.id });
}
function closeLook() {
  const el = $('look'); el.classList.remove('is-open');
  setTimeout(() => { if (!el.classList.contains('is-open')) el.hidden = true; }, 380);
  store.unlock(el);
  lookKey = '';
  const back = lastFocus && document.querySelector(`li[data-k="${CSS.escape(lastFocus)}"] [data-look]`);
  if (back) back.focus({ preventScroll: true });
}
$('look').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeLook(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('look').hidden) closeLook(); });
function render() {
  document.title = store.t('m.page') + ' — Larisel';
  renderLibrary(); fillLook();
}
store.onLang(render);
render();
if (location.hash) { const t = document.querySelector(location.hash); if (t) t.scrollIntoView(); }
</script>
</body>
</html>
