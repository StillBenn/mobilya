if (LANGS.indexOf(asked) !== -1) lang = asked;

/* ══════════════════════════════════════════════════════════════════════════
   CATALOGUE AND PRICES — edit here
   ══════════════════════════════════════════════════════════════════════════
   Names are per language and live on the item, not in a parallel list: a
   colour and its three names can never drift apart if they are one object.
   Prices are in US dollars: the same demo goes to Turkish, Russian and
   international clients, and one currency across every piece of work reads
   as one studio. Only the
   grouping follows the reader's locale.                                    */

const PRICE_BASE = 1290;
const LEAD_TIME = 14;   // days

const FABRICS = [

     warm earth, then the deep ones. Every one also dresses the cushion. */

  { id: 'sand',       hex: '#d8c3a5', price: 0,  name: { en: 'Sand',       tr: 'Kum',          ru: 'Песочный' } },
  { id: 'stone',      hex: '#b8b0a3', price: 0,  name: { en: 'Stone',      tr: 'Taş',          ru: 'Камень' } },
  { id: 'sage',       hex: '#9aa38b', price: 70, name: { en: 'Sage',       tr: 'Adaçayı',      ru: 'Шалфей' } },

  { id: 'ochre',      hex: '#c0913f', price: 95, name: { en: 'Ochre',      tr: 'Hardal',       ru: 'Охра' } },
  { id: 'terracotta', hex: '#a8553c', price: 95, name: { en: 'Terracotta', tr: 'Terakota',     ru: 'Терракота' } },
  { id: 'rose',       hex: '#c4968a', price: 95, name: { en: 'Dusty rose', tr: 'Gül kurusu',   ru: 'Пыльная роза' } },
  { id: 'bordeaux',   hex: '#6a2c34', price: 95, name: { en: 'Bordeaux',   tr: 'Bordo',        ru: 'Бордо' } },
  { id: 'indigo',     hex: '#2f3f5c', price: 95, name: { en: 'Indigo',     tr: 'İndigo',       ru: 'Индиго' } },
  { id: 'graphite',   hex: '#3c4045', price: 70, name: { en: 'Graphite',   tr: 'Grafit',       ru: 'Графит' } },
];

const FRAMES = [
  /* four woods from light to dark, then four metals: one row each */
  { id: 'bleached', hex: '#d9c4a0', price: 60,
    name: { en: 'Bleached oak', tr: 'Ağartılmış meşe', ru: 'Беленый дуб' } },
  { id: 'oak',      hex: '#b98b52', price: 0,
    name: { en: 'Oak',          tr: 'Meşe',            ru: 'Дуб' } },
  { id: 'smoked',   hex: '#8a7866', price: 140,
    name: { en: 'Smoked oak',   tr: 'Füme meşe',       ru: 'Дымчатый дуб' } },
  { id: 'walnut',   hex: '#5b3a24', price: 110,
    name: { en: 'Walnut',       tr: 'Ceviz',           ru: 'Орех' } },
  { id: 'nickel',   hex: '#c4c2bd', price: 220,
    name: { en: 'Brushed nickel', tr: 'Nikel',         ru: 'Никель' } },
  { id: 'brass',    hex: '#c8a46a', price: 280,
    name: { en: 'Brass',        tr: 'Pirinç',          ru: 'Латунь' } },
  { id: 'bronze',   hex: '#8f7656', price: 260,
    name: { en: 'Bronze',       tr: 'Bronz',           ru: 'Бронза' } },
  { id: 'black',    hex: '#2a2c30', price: 160,
    name: { en: 'Black steel',  tr: 'Siyah metal',     ru: 'Чёрный металл' } },
];

/* XL changes the PROPORTIONS, not the overall scale: the chair gets visibly
   wider. In an empty scene a uniform enlargement is indistinguishable from
   the camera moving closer. */
const SIZES = [
  { id: 'std', scale: { x: 1.00, y: 1.00, z: 1.00 }, price: 0,
    name: { en: 'Standard', tr: 'Standart', ru: 'Стандарт' },
    dims: { en: 'W 78 × D 82 × H 74 cm', tr: 'G 78 × D 82 × Y 74 cm', ru: 'Ш 78 × Г 82 × В 74 см' } },

    name: { en: 'XL', tr: 'XL', ru: 'XL' },
    dims: { en: 'W 92 × D 88 × H 78 cm', tr: 'G 92 × D 88 × Y 78 cm', ru: 'Ш 92 × Г 88 × В 78 см' } },
];

const PILLOW = { price: 90 };

/* Pairings: a chair, a cushion and a frame chosen together — one tap sets all
   three, and every one of them stays editable afterwards. */
const PAIRS = [
  { fabric: 'sand',     frame: 'walnut',   pillow: 'terracotta', name: { en: 'Earth',    tr: 'Toprak', ru: 'Земля' } },
  { fabric: 'forest',   frame: 'brass',    pillow: 'ochre',      name: { en: 'Club',     tr: 'Kulüp',  ru: 'Клуб' } },
  { fabric: 'sage',     frame: 'bleached', pillow: 'rose',       name: { en: 'Garden',   tr: 'Bahçe',  ru: 'Сад' } },
  { fabric: 'cream',    frame: 'black',    pillow: 'indigo',     name: { en: 'Gallery',  tr: 'Galeri', ru: 'Галерея' } },
  { fabric: 'bordeaux', frame: 'bronze',   pillow: 'sand',       name: { en: 'Opera',    tr: 'Opera',  ru: 'Опера' } },
  { fabric: 'indigo',   frame: 'nickel',   pillow: 'stone',      name: { en: 'Midnight', tr: 'Gece',   ru: 'Полночь' } },
];
/* every swatch is a rendered sample of the material (swatch_config.py), and
   every pairing a small render of the chair dressed in it (pair_thumbs.py) */
const swatchSrc = (kind, item) => 'renders/swatch/' + (kind === 'frame' ? 'frm' : 'fab') + '-' + item.id + '.webp';
const pairSrc = (pr) => 'renders/pairs/' + pr.fabric + '-' + pr.frame + '-' + pr.pillow + '.webp';
const byId = (items, id) => items.find(it => it.id === id);

const nameOf = (item) => item.name[lang];

function totalPrice(state) {
  return PRICE_BASE
    + state.fabric.price
    + state.frame.price
    + state.size.price
    + (state.pillow ? PILLOW.price : 0);
}

function formatPrice(value) {

}

/* ══════════════════════════════════════════════════════════════════════════
   THE CHAIR, RENDERED
   ══════════════════════════════════════════════════════════════════════════
   Every option is a photograph-grade render (Blender, Cycles), not a live
   model: the chair turns on a 72-step turntable under a fixed studio light,
   so the window's light slides over it as it would on a real one. Each option
   is its own layer, and the page stacks the ones chosen:
     empty studio × shadow   (multiply: the chair's shadow on that floor)
     upholstery + frame      (added: each was rendered holding the other out,
                              so together they cover exactly the chair)
     × cushion's shadow      (multiply: what the cushion does to the chair,
                              measured as the chair with it / without it)
     cushion                 (over: lit with the chair there)
   Two sets: light frames (800 px, one pack per layer) while the chair moves,
   the full 1600 px frame once it rests. Frames are cropped to what they cover
   and decoded on demand within a memory budget, so a phone holds the chair's
   size, not 72 stage-sized images.
   The renders and the tooling that makes them: _film/config (build, render,
   pack).                                                                   */

const STEPS = 72;
const RENDERS = './renders/';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(screen.width, screen.height) < 700;
const saveData = !!(navigator.connection && navigator.connection.saveData);
/* bytes of decoded frames kept, per set: the light frames hold a whole turn of
   the chosen dress (~90 MB, ~125 with the cushion), the sharp ones a few rests —
   in one pool the sharp frames (10 MB an angle) pushed the warmed turn out */
const BUDGET = { lite: (small ? 84 : 150) * 1048576, hd: (small ? 24 : 48) * 1048576 };

const manifests = {}, manifestSync = {};
function manifestOf(size) {
  return manifests[size] || (manifests[size] = fetch(RENDERS + size + '/manifest.json')
    .then((r) => { if (!r.ok) throw new Error('manifest ' + size); return r.json(); })
    .then((m) => (manifestSync[size] = m))
    .catch((e) => { delete manifests[size]; throw e; }));
}

/* decoded frames: the least recently used go first once over the budget */
const cache = new Map();
const cacheBytes = { lite: 0, hd: 0 };
const tierOf = (key) => key.slice(0, key.indexOf('/'));
function remember(key, bmp) {
  const bytes = bmp.width * bmp.height * 4, tier = tierOf(key);
  cache.set(key, { bmp, bytes }); cacheBytes[tier] += bytes;
  for (const [k, v] of cache) {
    if (cacheBytes[tier] <= BUDGET[tier]) break;
    if (k === key || tierOf(k) !== tier) continue;
    cache.delete(k); cacheBytes[tier] -= v.bytes;
    if (v.bmp.close) v.bmp.close();
  }
}
function recall(key) {
  const hit = cache.get(key);
  if (!hit) return null;
  cache.delete(key); cache.set(key, hit);           // touched: the newest again
  return hit.bmp;
}

/* a layer's light frames come in one pack: one request, then sliced */
const packs = new Map();
function packOf(size, name) {
  const id = size + '/' + name;
  if (!packs.has(id)) {
    const p = manifestOf(size).then((m) => {
      const L = m.layers[name].lite;
      return fetch(RENDERS + size + '/' + L.pack)
        .then((r) => { if (!r.ok) throw new Error(L.pack); return r.arrayBuffer(); })
        .then((buf) => {
          const out = []; let at = 0;
          for (const n of L.sizes) { out.push(new Blob([new Uint8Array(buf, at, n)], { type: 'image/webp' })); at += n; }
          return out;
        });
    });
    p.catch(() => packs.delete(id));                // a failed download may be tried again
    packs.set(id, p);
  }
  return packs.get(id);
}

const pending = new Map();
function decode(tier, size, name, i) {
  const key = tier + '/' + size + '/' + name + '/' + i;
  const have = recall(key);
  if (have) return Promise.resolve(have);
  if (pending.has(key)) return pending.get(key);
  const blob = tier === 'lite'
    ? packOf(size, name).then((blobs) => blobs[i])
    : manifestOf(size).then((m) => fetch(RENDERS + size + '/' + m.layers[name].hd.dir + String(i + 1).padStart(2, '0') + '.webp'))
        .then((r) => { if (!r.ok) throw new Error(name + ' ' + i); return r.blob(); });
  const p = blob.then((b) => createImageBitmap(b)).then(
    (bmp) => { pending.delete(key); remember(key, bmp); return bmp; },
    (err) => { pending.delete(key); throw err; });
  pending.set(key, p);
  return p;
}

/* the empty studio: once per size and set */
const grounds = new Map();
function groundOf(tier, size) {
  const id = tier + '/' + size;
  if (!grounds.has(id)) {
    const p = manifestOf(size)
      .then((m) => fetch(RENDERS + size + '/' + m.bg0[tier]))
      .then((r) => { if (!r.ok) throw new Error('ground'); return r.blob(); })
      .then((b) => createImageBitmap(b))
      .then((bmp) => { grounds.set(id + '!', bmp); return bmp; });
    p.catch(() => grounds.delete(id));
    grounds.set(id, p);
  }
  return grounds.get(id);
}

/* the layers a choice needs, and a key that names it */
const layersOf = (sel) => ['shadow', 'fab-' + sel.fabric, 'frm-' + sel.frame].concat(sel.pillow ? ['pilsh', 'pil-' + sel.pillowFabric] : []);
const keyOf = (sel) => [sel.size, sel.fabric, sel.frame, sel.pillow ? sel.pillowFabric : '-'].join('|');
const want = (tier, sel, i) => Promise.all([groundOf(tier, sel.size)].concat(layersOf(sel).map((n) => decode(tier, sel.size, n, i))));
const canCompose = (tier, sel, i) => grounds.has(tier + '/' + sel.size + '!') && !!manifestSync[sel.size]
  && layersOf(sel).every((n) => cache.has(tier + '/' + sel.size + '/' + n + '/' + i));

/* stack one angle of a choice into a frame-sized canvas */
const frameCv = { lite: document.createElement('canvas'), hd: document.createElement('canvas') };
const chairCv = { lite: document.createElement('canvas'), hd: document.createElement('canvas') };
function compose(tier, sel, i, into) {
  if (!canCompose(tier, sel, i)) return null;
  const m = manifestSync[sel.size];
  const [fw, fh] = m.tiers[tier];
  const c = into || frameCv[tier], b = chairCv[tier];
  if (c.width !== fw || c.height !== fh) { c.width = fw; c.height = fh; }
  if (b.width !== fw || b.height !== fh) { b.width = fw; b.height = fh; }
  const names = layersOf(sel);
  const put = (ctx, n) => {
    const k = m.layers[n][tier].boxes[i];
    ctx.drawImage(recall(tier + '/' + sel.size + '/' + n + '/' + i), k[0], k[1], k[2], k[3]);
  };
  const g = c.getContext('2d'), h = b.getContext('2d');
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.drawImage(grounds.get(tier + '/' + sel.size + '!'), 0, 0, fw, fh);
  g.globalCompositeOperation = 'multiply'; put(g, names[0]);
  h.globalCompositeOperation = 'source-over'; h.clearRect(0, 0, fw, fh);
  h.globalCompositeOperation = 'lighter'; put(h, names[1]); put(h, names[2]);
  h.globalCompositeOperation = 'source-over';
  g.globalCompositeOperation = 'source-over'; g.drawImage(b, 0, 0);
  if (names[3]) {
    g.globalCompositeOperation = 'multiply'; put(g, names[3]);     // the cushion's shadow on the chair
    g.globalCompositeOperation = 'source-over'; put(g, names[4]);  // the cushion
  }
  return c;
}

/* ── state ─────────────────────────────────────────────────────────────── */
const state = {
  fabric: byId(FABRICS, 'sand'), frame: byId(FRAMES, 'oak'), size: SIZES[0],
  pillow: false, pillowFabric: byId(FABRICS, 'terracotta')
};
const selOf = () => ({ size: state.size.id, fabric: state.fabric.id, frame: state.frame.id,
                       pillow: state.pillow, pillowFabric: state.pillowFabric.id });
let targetPrice = totalPrice(state);
let shownPrice = targetPrice;

/* ── interface ─────────────────────────────────────────────────────────── */
const els = {
  fabrics: document.getElementById('fabrics'),
  frames: document.getElementById('frames'),
  sizes: document.getElementById('sizes'),
  pillow: document.getElementById('pillow'),
  pillowPrice: document.getElementById('pillow-price'),
  vFabric: document.getElementById('v-fabric'),
  vFrame: document.getElementById('v-frame'),
  vSize: document.getElementById('v-size'),
  vPillow: document.getElementById('v-pillow'),
  price: document.getElementById('price'),
  dims: document.getElementById('dims'),
  lead: document.getElementById('lead'),
  toast: document.getElementById('toast'),
  pillowFabrics: document.getElementById('pillow-fabrics'),
  pillowOptions: document.getElementById('pillow-options'),
  pairs: document.getElementById('pairs'),
};

function makeSwatch(item, kind, isActive) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch' + (isActive ? ' is-active' : '');
  b.dataset.id = item.id;
  b.style.backgroundColor = item.hex;           // until the sample arrives, and if it never does
  b.style.backgroundImage = 'url(' + swatchSrc(kind, item) + ')';
  return b;
}

/* The swatch's own label is written by the language pass, not at build time,
   so switching language does not have to rebuild the rows. */
function labelSwatches(container, items) {
  const buttons = container.querySelectorAll('.swatch');
  items.forEach((item, i) => {
    const b = buttons[i];
    if (!b) return;
    const extra = item.price ? ' · +' + formatPrice(item.price) : '';
    b.dataset.name = nameOf(item) + extra;
    b.setAttribute('aria-label', nameOf(item) + extra);
    b.title = nameOf(item) + extra;
  });
}

function buildSwatchRow(container, items, kind, onPick) {
  container.innerHTML = '';
  items.forEach((item) => {
    const b = makeSwatch(item, kind, false);
    b.addEventListener('click', () => onPick(item));
    container.appendChild(b);
  });
}

/* the chosen one in a row, by id: written from the state, never from the click */
function markRow(container, selector, id) {
  container.querySelectorAll(selector).forEach((b) => {
    const on = b.dataset.id === id;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

const pairOn = (pr) => state.pillow && state.fabric.id === pr.fabric
  && state.pillowFabric.id === pr.pillow && state.frame.id === pr.frame;

PAIRS.forEach((pr, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pair';
  b.dataset.id = String(i);
  const img = document.createElement('img');
  img.className = 'pair-thumb';
  img.src = pairSrc(pr); img.alt = ''; img.width = img.height = 56; img.decoding = 'async';
  img.addEventListener('error', () => { img.style.visibility = 'hidden'; });   // the card's ground, not a broken-image icon
  const text = document.createElement('span');
  text.className = 'pair-text';
  const name = document.createElement('span');
  name.className = 'pair-name';
  const dots = document.createElement('span');
  dots.className = 'pair-dots';
  dots.setAttribute('aria-hidden', 'true');
  [['fabric', byId(FABRICS, pr.fabric)], ['fabric', byId(FABRICS, pr.pillow)], ['frame', byId(FRAMES, pr.frame)]].forEach(([kind, item]) => {
    const d = document.createElement('i');
    d.style.backgroundColor = item.hex;
    d.style.backgroundImage = 'url(' + swatchSrc(kind, item) + ')';
    dots.appendChild(d);
  });
  text.append(name, dots);
  b.append(img, text);
  b.addEventListener('click', () => {
    state.fabric = byId(FABRICS, pr.fabric);
    state.pillowFabric = byId(FABRICS, pr.pillow);
    state.frame = byId(FRAMES, pr.frame);
    state.pillow = true;
    refresh(); changed();
  });
  els.pairs.appendChild(b);
});

buildSwatchRow(els.fabrics, FABRICS, 'fabric', item => {
  state.fabric = item;
  refresh(); changed();
});

buildSwatchRow(els.frames, FRAMES, 'frame', item => {
  state.frame = item;
  refresh(); changed();
});

buildSwatchRow(els.pillowFabrics, FABRICS, 'fabric', item => {
  state.pillowFabric = item;
  refresh(); changed();
});

SIZES.forEach((item) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pill';
  b.dataset.id = item.id;
  b.addEventListener('click', () => {
    state.size = item;
    refresh(); changed();
  });
  els.sizes.appendChild(b);
});

els.pillow.addEventListener('change', () => {
  state.pillow = els.pillow.checked;
  refresh(); changed();
});

/* One function writes every piece of text that depends on either the state
   or the language, so the two can never disagree. */
function refresh() {
  targetPrice = totalPrice(state);

  els.vFabric.textContent = nameOf(state.fabric);
  els.vFrame.textContent = nameOf(state.frame);
  els.vSize.textContent = nameOf(state.size);
  els.vPillow.textContent = nameOf(state.pillowFabric);
  els.dims.textContent = state.size.dims[lang];
  els.lead.textContent = t('lead').replace('%d', LEAD_TIME);
  els.pillowPrice.textContent = '+' + formatPrice(PILLOW.price);

  labelSwatches(els.fabrics, FABRICS);
  labelSwatches(els.frames, FRAMES);
  labelSwatches(els.pillowFabrics, FABRICS);

  markRow(els.fabrics, '.swatch', state.fabric.id);
  markRow(els.frames, '.swatch', state.frame.id);
  markRow(els.pillowFabrics, '.swatch', state.pillowFabric.id);
  markRow(els.sizes, '.pill', state.size.id);
  els.pillow.checked = state.pillow;
  els.pillowOptions.hidden = !state.pillow;

  els.pairs.querySelectorAll('.pair').forEach((b) => {
    const pr = PAIRS[+b.dataset.id];
    const on = pairOn(pr);
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
    b.querySelector('.pair-name').textContent = nameOf(pr);
    const label = nameOf(pr) + ': ' + nameOf(byId(FABRICS, pr.fabric)) + ', '
      + t('pairs.cushion') + ' ' + nameOf(byId(FABRICS, pr.pillow)).toLocaleLowerCase(lang) + ', ' + nameOf(byId(FRAMES, pr.frame));
    b.setAttribute('aria-label', label);
    b.title = label;
  });

  els.sizes.querySelectorAll('.pill').forEach((b) => {
    const item = SIZES.find(s => s.id === b.dataset.id);
    if (item) b.textContent = nameOf(item);
  });
}

function applyLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.title = t('title');
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', t('desc'));

  document.querySelectorAll('[data-t]').forEach((el) => {
    el.textContent = t(el.dataset.t);
  });

  document.querySelectorAll('[data-lang]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === next));
  });

  refresh();
  /* The price is written by the animation loop, which only repaints when the
     number is actually moving — a language change alters the formatting, not
     the value, so it has to be written once by hand. */
  els.price.textContent = formatPrice(shownPrice);

  try { localStorage.setItem(STORE, next); } catch (e) { /* private mode */ }
}

document.querySelectorAll('[data-lang]').forEach((b) => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

/* back to the first view: the shorter way round, and out of any zoom */
document.getElementById('reset').addEventListener('click', () => {
  const a = ((view.angle % STEPS) + STEPS) % STEPS;
  const to = view.angle - a + (a > STEPS / 2 ? STEPS : 0);
  view.vel = 0;
  if (Math.abs(to - view.angle) > 0.01) view.play = { from: view.angle, to, t0: performance.now(), dur: reducedMotion ? 1 : 900 };
  view.zoomTo = 1;
  wake();
});

/* the snapshot is the full render of the angle on screen, not the screen */
document.getElementById('snapshot').addEventListener('click', () => {
  const sel = selOf(), i = idx(view.angle);
  want('hd', sel, i).then(() => {
    const c = document.createElement('canvas');
    if (!compose('hd', sel, i, c)) return;
    c.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.download = 'larisel-' + state.fabric.id + '-' + state.frame.id + '.png';
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(t('saved'));
    }, 'image/png');
  }, () => {});
});

document.getElementById('order').addEventListener('click', () => {
  toast([nameOf(state.size), nameOf(state.fabric), nameOf(state.frame)].join(' · ')
        + ' — ' + formatPrice(totalPrice(state)));
});

let toastTimer;
function toast(text) {
  els.toast.textContent = text;
  els.toast.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('is-on'), 2800);
}

applyLang(lang);

const canvas = document.getElementById('scene');
const stage = document.getElementById('stage');

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════════ */
const ctx = canvas.getContext('2d');
let dpr = 1;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; shown.key = ''; }
  wake();
}
addEventListener('resize', resize);
/* The stage can change size without the window ever resizing — a stylesheet
   arriving late, a mobile URL bar sliding away. Watching the element itself
   is the only reliable signal. */
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);

/* Smoothing is tied to time, not to frames: the transition takes the same
   wall-clock time at 60 Hz, at 144 Hz, and on a laptop that is dropping
   frames. */
function smooth(rate, dt) {
  return 1 - Math.exp(-rate * dt);
}
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const idx = (a) => ((Math.round(a) % STEPS) + STEPS) % STEPS;

/* the turntable: angle in steps (5 degrees each), dragged, thrown, or played */
const view = { angle: 0, vel: 0, dragging: false, play: null, zoom: 1, zoomTo: 1, quietSince: 0 };
const PX_PER_STEP = small ? 5 : 6;                  // a full turn is ~430 px of drag
/* where the chair sits in the frame (fractions): zoom closes in on it */
const CX = 0.5, CY = 0.56;

const pointers = new Map();
let lastX = 0, lastT = 0, pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = view.zoomTo; view.dragging = false;
    return;
  }
  view.dragging = true; view.play = null; view.vel = 0;
  lastX = e.clientX; lastT = performance.now();
  document.body.classList.add('is-turned');         // the prompt has been followed
  wake();
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) view.zoomTo = Math.min(1.8, Math.max(1, zoom0 * d / pinch0));
    wake();
    return;
  }
  if (!view.dragging) return;
  const now = performance.now(), dx = e.clientX - lastX;
  /* the surface follows the finger: a step turns the chair's front towards the
     camera's right (the chair turns counter-clockwise seen from above), so a
     drag to the right is a step forward */
  const ds = dx / PX_PER_STEP;
  view.angle += ds;
  const dt = Math.max(0.008, (now - lastT) / 1000);
  view.vel = view.vel * 0.6 + (ds / dt) * 0.4;
  lastX = e.clientX; lastT = now;
  wake();
});
const release = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch0 = 0;
  if (pointers.size === 0 && view.dragging) {
    view.dragging = false;
    if (performance.now() - lastT > 90) view.vel = 0;   // held still before letting go: no throw
    wake();
  }
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.zoomTo = Math.min(1.8, Math.max(1, view.zoomTo * Math.exp(-e.deltaY * 0.0015)));
  wake();
}, { passive: false });
canvas.addEventListener('dblclick', () => { view.zoomTo = view.zoomTo > 1.2 ? 1 : 1.6; wake(); });

/* what is on the screen, and a fade from what was there before */
const shown = { key: '', sel: '', tier: '' };
const fadeCv = document.createElement('canvas');
let fade = null;                                     // { t0, dur }

function paint(frame) {
  const W = canvas.width, H = canvas.height, fw = frame.width, fh = frame.height;
  const s0 = Math.max(W / fw, H / fh), s = s0 * view.zoom;
  /* zoom keeps the chair where it stood, as far as the frame still covers the stage */
  const px = W / 2 + (CX - 0.5) * fw * s0, py = H / 2 + (CY - 0.5) * fh * s0;
  let dx = px - CX * fw * s, dy = py - CY * fh * s;
  dx = Math.min(0, Math.max(W - fw * s, dx)); dy = Math.min(0, Math.max(H - fh * s, dy));
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(frame, dx, dy, fw * s, fh * s);
}

function startFade(dur) {
  if (reducedMotion || !shown.key) return;
  if (fadeCv.width !== canvas.width || fadeCv.height !== canvas.height) { fadeCv.width = canvas.width; fadeCv.height = canvas.height; }
  const f = fadeCv.getContext('2d');
  f.clearRect(0, 0, fadeCv.width, fadeCv.height); f.drawImage(canvas, 0, 0);
  fade = { t0: performance.now(), dur };
}

let running = false, lastFrameT = 0, started = false;
function wake() {
  if (running) return;
  running = true; lastFrameT = performance.now();
  requestAnimationFrame(tick);
}

function tick(now) {
  const dt = Math.min((now - lastFrameT) / 1000, 0.1);
  lastFrameT = now;
  let busy = false;

  /* motion: a played turn (the opening, a reset), a throw, or the hand */
  if (view.play) {
    const p = Math.min(1, (now - view.play.t0) / view.play.dur);
    view.angle = view.play.from + (view.play.to - view.play.from) * ease(p);
    if (p >= 1) { view.angle = view.play.to % STEPS; view.play = null; }
    busy = true;
  } else if (!view.dragging) {
    if (Math.abs(view.vel) > 0.6) {
      view.angle += view.vel * dt;
      view.vel *= Math.exp(-3.2 * dt);
      busy = true;
    } else {
      view.vel = 0;
      const to = Math.round(view.angle);
      if (Math.abs(to - view.angle) > 0.01) { view.angle += (to - view.angle) * smooth(14, dt); busy = true; }
      else view.angle = to;
    }
  } else busy = true;
  const moving = busy;
  if (moving) view.quietSince = now;

  view.zoom += (view.zoomTo - view.zoom) * smooth(10, dt);
  if (Math.abs(view.zoomTo - view.zoom) > 0.0005) busy = true; else view.zoom = view.zoomTo;

  /* the price counts its way to the new total */
  if (Math.abs(shownPrice - targetPrice) > 1) {
    shownPrice += (targetPrice - shownPrice) * smooth(10, dt);
    els.price.textContent = formatPrice(shownPrice);
    busy = true;
  } else if (shownPrice !== targetPrice) {
    shownPrice = targetPrice;
    els.price.textContent = formatPrice(shownPrice);
  }

  /* the frame: sharp once the chair has rested for a moment, light while it moves */
  const sel = selOf(), sk = keyOf(sel), i = idx(view.angle);
  const rest = !moving && now - view.quietSince > 120;
  /* ask only for what is missing: a resolved request wakes the loop, so asking
     for what is already here would keep an idle page drawing forever */
  if (!canCompose('lite', sel, i)) want('lite', sel, i).then(wake, () => {});
  if (rest && !canCompose('hd', sel, i)) want('hd', sel, i).then(wake, () => {});
  /* ahead of the turn: the next frames in its direction, light */
  const dir = view.vel < 0 || (view.play && view.play.to < view.play.from) ? -1 : 1;
  if (moving) {
    for (let k = 1; k <= 6; k++) {
      const j = idx(i + dir * k);
      for (const n of layersOf(sel)) decode('lite', sel.size, n, j).catch(() => {});
    }
  }

  let tier = rest && canCompose('hd', sel, i) ? 'hd' : canCompose('lite', sel, i) ? 'lite' : (canCompose('hd', sel, i) ? 'hd' : null);
  if (tier) {
    const key = sk + '#' + i + '#' + tier;
    const zoomed = Math.abs(view.zoom - (shown.zoom || 1)) > 0.0005;
    if (key !== shown.key || fade || zoomed || shown.w !== canvas.width) {
      if (shown.sel && shown.sel !== sk) startFade(reducedMotion ? 0 : 380);           // a new choice dissolves in
      else if (shown.sel === sk && shown.tier === 'lite' && tier === 'hd' && shown.i === i) startFade(220);   // sharpening, no pop
      else if (shown.sel === sk && shown.i !== i && !reducedMotion) {
        /* a step of the turn: as slow steps come (the end of a throw, the
           opening easing out) each 5-degree step ticked; a dissolve as long as
           the step itself smooths it, and at speed it is too short to see */
        const d = Math.min(110, (now - (shown.stepT || now)) * 0.9);
        if (d >= 16) startFade(d);                    // under a frame: nothing to dissolve (and 0 ms divided by zero)
      }
      const frame = compose(tier, sel, i);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      paint(frame);
      if (fade) {
        const p = Math.min(1, (now - fade.t0) / fade.dur);
        ctx.globalAlpha = 1 - ease(p); ctx.drawImage(fadeCv, 0, 0); ctx.globalAlpha = 1;
        if (p >= 1) fade = null; else busy = true;
      }
      if (shown.i !== i) shown.stepT = now;
      Object.assign(shown, { key, sel: sk, tier, i, zoom: view.zoom, w: canvas.width });
      if (!started) {
        started = true;
        document.body.classList.add('is-ready');
        intro();
      }
    }
  }
  /* keep drawing while something moves, or until the chair has rested long
     enough to ask for its sharp frame; a missing frame wakes the loop itself */
  if (busy || (!moving && !rest)) requestAnimationFrame(tick);
  else running = false;
}

/* the opening: once the light frames are here, the chair turns once on its own */
/* Warm the turn: the light frames of the chosen dress decoded ahead, nearest
   angles first, three at a time, as many as the budget holds (all 72 on a
   desk). Decoding on demand was the turn's stutter: a 5-degree step asked for
   three to five fresh decodes, and a throw outran them. A new choice starts
   over from the angle on screen. */
let warmGen = 0;
function warm(sel, from) {
  const gen = ++warmGen;
  return manifestOf(sel.size).then((m) => {
    const names = layersOf(sel);
    const perAngle = names.reduce((sum, n) => sum + m.layers[n].lite.boxes.reduce((a, b) => a + b[2] * b[3] * 4, 0) / STEPS, 0);
    const fit = Math.max(1, Math.min(STEPS, Math.floor(BUDGET.lite * 0.85 / perAngle)));
    const order = [idx(from)];
    for (let d = 1; order.length < fit; d++) {
      order.push(idx(from + d));
      if (order.length < fit) order.push(idx(from - d));
    }
    let k = 0;
    const next = () => {
      if (gen !== warmGen || k >= order.length) return null;
      const i = order[k++];
      return Promise.all(names.map((n) => decode('lite', sel.size, n, i))).then(next, next);
    };
    return Promise.all([next(), next(), next()]);
  });
}

function intro() {
  const sel = selOf();
  /* the turn plays once every angle of it is decoded: started on the downloads
     alone, it outran the decodes and stuttered on a first visit */
  warm(sel, idx(view.angle)).then(() => {
    later(preload);
    if (reducedMotion || document.body.classList.contains('is-turned')) return;
    view.play = { from: view.angle, to: view.angle + STEPS, t0: performance.now(), dur: 3600 };
    wake();
  }, () => {});
}
const later = (fn) => ('requestIdleCallback' in window ? requestIdleCallback(fn, { timeout: 2500 }) : setTimeout(fn, 1200));

/* Afterwards, quietly: the light packs of every other option of this size, so
   a choice turns at once. Not on a phone or a saver connection — there a
   choice loads when it is made (~0.3-1 MB). */
function preload() {
  if (small || saveData) return;
  const size = state.size.id;
  const names = FABRICS.map((f) => 'fab-' + f.id).concat(FRAMES.map((f) => 'frm-' + f.id), FABRICS.map((f) => 'pil-' + f.id));
  let k = 0;
  const next = () => {
    if (k >= names.length) return;
    packOf(size, names[k++]).then(() => later(next), () => later(next));
  };
  next();
}

function changed() {
  targetPrice = totalPrice(state);
  if (started) warm(selOf(), idx(view.angle));     // the new dress, from the angle on screen
  wake();
}

/* the first frame: the sharp one, before anything else */
manifestOf(state.size.id).then(() => want('hd', selOf(), 0)).then(wake, () => wake());
resize();
</script>
</body>
</html>
