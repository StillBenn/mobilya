<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larisel furniture — 3D product configurator</title>
<meta name="description" content="A furniture configurator rendered like a photograph: an armchair, a sofa and a coffee table — choose the shape, the materials and the finish, turn the piece by hand, and watch the price recalculate.">

<meta property="og:type" content="website">
<meta property="og:title" content="Larisel furniture — 3D product configurator">
<meta property="og:description" content="Build the armchair, the sofa or the coffee table for your room — rendered like a photograph, turned by hand, priced as you go.">
<meta property="og:url" content="https://larisel.com/mobilya/">
<meta property="og:image" content="https://larisel.com/mobilya/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#ece7de">
<link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/img/favicon.svg?v=2" type="image/svg+xml">

<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/base.css?v=1">
<link rel="stylesheet" href="css/style.css?v=11">
<link rel="stylesheet" href="css/store.css?v=3">

</head>
<body>

<header class="site-head site-head--line" data-site-head></header>

<div class="app">

  <main id="stage" class="stage">
    <canvas id="scene"></canvas>
    <div class="stage-load" aria-hidden="true"></div>

    <div class="stage-bottom">
      <div class="stage-bottom__left">
        <p id="dims" class="chip chip--mono"></p>
        <p class="hint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01M20.5 3.5v4.2h-4.2"/></svg>
          <span data-t="hint"></span>
        </p>
      </div>

      <div class="tools">
        <button type="button" id="measure" class="tool" aria-pressed="false" data-tip="t.dims">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5 17.5 3l3.5 3.5L6.5 21z"/><path d="M7 13.5l1.6 1.6M9.8 10.7l2.4 2.4M12.6 7.9l1.6 1.6M15.4 5.1l2.4 2.4"/></svg>
          <span data-t="t.dims"></span>
        </button>
        <button type="button" id="compare" class="tool" data-tip="t.compare">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="7.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.6"/></svg>
          <span data-t="t.compare"></span>
          <i class="tool__badge" aria-hidden="true">A</i>
        </button>
        <button type="button" id="share" class="tool" data-tip="t.share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>
          <span data-t="t.share"></span>
        </button>
        <button type="button" id="snapshot" class="tool" data-tip="snapshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
          <span data-t="snapshot"></span>
        </button>
        <button type="button" id="reset" class="tool" data-tip="reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
          <span data-t="reset"></span>
        </button>
      </div>
    </div>

  </main>

  <aside class="panel">

    <header class="panel-head">
      <div class="products" role="tablist" aria-label="Product">
        <button type="button" class="product" role="tab" data-product="armchair" aria-selected="true">
          <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M9 21v-3M31 21v-3M7 18h26M8.5 18v-7.5a2.5 2.5 0 0 1 5 0V14h13v-3.5a2.5 2.5 0 0 1 5 0V18M12 10V5.5A2.5 2.5 0 0 1 14.5 3h11A2.5 2.5 0 0 1 28 5.5V10"/></svg>
          <span data-t="p.armchair"></span>
        </button>
        <button type="button" class="product" role="tab" data-product="sofa" aria-selected="false">
          <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M6 21v-3M34 21v-3M3.5 18h33M4 18v-7.5a2.5 2.5 0 0 1 5 0V14h22v-3.5a2.5 2.5 0 0 1 5 0V18M8 10V6a2.5 2.5 0 0 1 2.5-2.5h19A2.5 2.5 0 0 1 32 6v4M20 3.5V14"/></svg>
          <span data-t="p.sofa"></span>
        </button>
        <button type="button" class="product" role="tab" data-product="table" aria-selected="false">
          <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M4.5 8.5h31M5 8.5a1.5 1.5 0 0 0 1.5 1.6h27a1.5 1.5 0 0 0 1.5-1.6M16.5 10.1V19.5M23.5 10.1V19.5M12.5 20.5h15"/></svg>
          <span data-t="p.table"></span>
        </button>
      </div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </header>

    <div class="panel-body">

      <section class="group">
        <div class="group-head">
          <h2 data-t="g.pairs"></h2>
          <span id="pairs-note" class="group-value"></span>
        </div>
        <div id="pairs" class="pairs"></div>
      </section>

      <section class="group" id="g-form">
        <div class="group-head">
          <h2 id="h-form"></h2>
          <span id="v-form" class="group-value"></span>
        </div>
        <div id="forms" class="pills"></div>
      </section>

      <section class="group">
        <div class="group-head">
          <h2 id="h-fabric"></h2>
          <span class="group-side">
            <span id="v-fabric" class="group-value"></span>
            <button type="button" id="closeup-open" class="look" data-t-aria="t.closeup">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.5v6M7.5 10.5h6"/></svg>
              <span data-t="t.closeup"></span>
            </button>
          </span>
        </div>
        <div id="fabric-types" class="ftabs" role="tablist"></div>
        <div id="fabrics" class="swatches"></div>
      </section>

      <section class="group">
        <div class="group-head">
          <h2 id="h-frame"></h2>
          <span id="v-frame" class="group-value"></span>
        </div>
        <div id="frames" class="swatches swatches--4"></div>
      </section>

      <section class="group" id="g-extras">
        <div class="group-head">
          <h2 data-t="g.extras"></h2>
        </div>

        <label class="check">
          <input type="checkbox" id="pillow">
          <span class="check-box" aria-hidden="true"></span>
          <span class="check-text" id="pillow-text"></span>
          <span class="check-price" id="pillow-price"></span>
        </label>

        <div id="pillow-options" class="pillow-options" hidden>
          <div class="group-head">
            <h2 data-t="g.cushion"></h2>
            <span id="v-pillow" class="group-value"></span>
          </div>
          <div id="pillow-types" class="ftabs" role="tablist"></div>
          <div id="pillow-fabrics" class="swatches"></div>
        </div>
      </section>

    </div>

    <footer class="panel-foot">
      <div class="price">
        <span class="price-label" data-t="total"></span>
        <strong id="price"></strong>
        <span id="lead" class="price-note"></span>
      </div>
      <div class="cta-row">
        <button type="button" id="order" class="cta" data-t="cta"></button>
        <button type="button" id="fav" class="fav-btn" aria-pressed="false" data-t-aria="t.fav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10C19.5 15.4 12 20 12 20z"/></svg></button>
      </div>
    </footer>

  </aside>

</div>

<div class="below" id="details">

  <section class="section">
    <div class="wrap spec-grid">
      <div>
        <p class="eyebrow-line" data-s="d.eyebrow"></p>
        <h2 class="spec-title" id="d-title"></h2>
        <p class="spec-lead" id="d-lead"></p>
        <dl class="specs" id="d-specs"></dl>
      </div>
      <form class="fit" id="fit" novalidate>
        <h3 data-s="fit.title"></h3>
        <p data-s="fit.lead"></p>
        <div class="fit__inputs">
          <label class="field"><span data-s="fit.w"></span><input id="fit-w" type="number" inputmode="numeric" min="40" max="400" value="80"></label>
          <label class="field"><span data-s="fit.h"></span><input id="fit-h" type="number" inputmode="numeric" min="120" max="400" value="200"></label>
        </div>
        <p class="fit__out" id="fit-out" data-v="" aria-live="polite"><i></i><span></span></p>
      </form>
    </div>
  </section>

  <section class="section">
    <div class="wrap grid-4 promises">
      <article class="promise"><span class="medal"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path class="a" d="M10.5 6.5h27M10.5 4.3v4.4M37.5 4.3v4.4M13.4 5 10.5 6.5l2.9 1.5M34.6 5l2.9 1.5-2.9 1.5"/>
      <path d="M15.5 27.5V18c0-4.6 3.8-7.3 8.5-7.3s8.5 2.7 8.5 7.3v9.5"/>
      <path d="M18.4 27.5v-8.8c0-2.9 2.4-4.6 5.6-4.6s5.6 1.7 5.6 4.6v8.8"/>
      <path d="M10.8 32.4v-8c0-2 1.4-3.4 3.2-3.4s3.2 1.4 3.2 3.4v5M37.2 32.4v-8c0-2-1.4-3.4-3.2-3.4s-3.2 1.4-3.2 3.4v5"/>
      <path d="M17.2 29.4c0-1.2.9-2 2-2h9.6c1.1 0 2 .8 2 2v1.6H17.2z"/>
      <path d="M10.8 31h26.4v2.6c0 1.2-.9 2.1-2.1 2.1H12.9c-1.2 0-2.1-.9-2.1-2.1z"/>
      <path d="M13.6 35.7l-1.5 6.3M34.4 35.7l1.5 6.3"/>
    </svg></span><p class="promise__unit" data-s="pr.1u"></p><h3 data-s="pr.1"></h3><p data-s="pr.1p"></p></article>
      <article class="promise"><span class="medal"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M4.5 33V15a2 2 0 0 1 2-2H29v20M29 19h7.2a2 2 0 0 1 1.6.8l4.4 5.9a2 2 0 0 1 .3 1V33h-2.6M33 33H17.6M10.4 33H4.5"/>
      <path d="M31.5 21.5h4.6l3.3 4.5h-7.9z"/>
      <circle cx="14" cy="34" r="3.4"/><circle cx="36.6" cy="34" r="3.4"/>
      <path class="a" d="M8.5 27.5v-3.6a1.4 1.4 0 0 1 2.8 0v1.3h11.4v-1.3a1.4 1.4 0 0 1 2.8 0v3.6zM11.3 23.9v-2.2a1.5 1.5 0 0 1 1.5-1.5h8.4a1.5 1.5 0 0 1 1.5 1.5v2.2M10 27.5v1.6M24 27.5v1.6"/>
    </svg></span><p class="promise__unit" data-s="pr.2u"></p><h3 data-s="pr.2"></h3><p data-s="pr.2p"></p></article>
      <article class="promise"><span class="medal"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M17.6 31.5 13.5 43l4.6-1.8 2.9 4 3-9.2M30.4 31.5 34.5 43l-4.6-1.8-2.9 4-3-9.2"/>
      <circle cx="24" cy="20" r="14"/>
      <circle cx="24" cy="20" r="10.6" stroke-dasharray="1.2 2.1"/>
      <text class="a-fill" x="24" y="24.4" text-anchor="middle">10</text>
    </svg></span><p class="promise__unit" data-s="pr.3u"></p><h3 data-s="pr.3"></h3><p data-s="pr.3p"></p></article>
      <article class="promise"><span class="medal"><svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M30.6 7.4c1.2-.9 2.9.4 2.2 1.8L13.3 38.6l-2.4 1.7.5-2.9z"/>
      <path d="M30.2 9.6l1-1.5"/>
      <path class="a" d="M30.9 8.6c5.8 1.9 8.9 9.2 4.6 13.5-3.7 3.7-9.9 1.6-11.4 6-1.5 4.4 3.4 8 8.4 5.9 3.1-1.3 4.5-4.1 3.9-6.8"/>
    </svg></span><p class="promise__unit" data-s="pr.4u"></p><h3 data-s="pr.4"></h3><p data-s="pr.4p"></p></article>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section__head"><p class="eyebrow-line" data-s="how.eyebrow"></p><h2 data-s="how.title"></h2></div>
      <ol class="grid-4 steps">
        <li class="step"><span class="step__n">01</span><h3 data-s="st.1"></h3><p data-s="st.1p"></p></li>
        <li class="step"><span class="step__n">02</span><h3 data-s="st.2"></h3><p data-s="st.2p"></p></li>
        <li class="step"><span class="step__n">03</span><h3 data-s="st.3"></h3><p data-s="st.3p"></p></li>
        <li class="step"><span class="step__n">04</span><h3 data-s="st.4"></h3><p data-s="st.4p"></p></li>
      </ol>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section__head"><p class="eyebrow-line" data-s="mat.eyebrow"></p><h2 data-s="mat.title"></h2><p data-s="mat.lead"></p></div>
      <div class="strip">
        <a data-s-aria="mat.sofaLink" href="materials/#sofa"><img src="renders/sofa/macro/velvet-emerald.webp" alt="" loading="lazy" decoding="async" width="1400" height="900"></a>
        <a data-s-aria="mat.sofaLink" href="materials/#sofa"><img src="renders/sofa/macro/boucle-oat.webp" alt="" loading="lazy" decoding="async" width="1400" height="900"></a>
        <a data-s-aria="mat.tableLink" href="materials/#table"><img src="renders/table/macro/nero.webp" alt="" loading="lazy" decoding="async" width="1400" height="900"></a>
        <a data-s-aria="mat.tableLink" href="materials/#table"><img src="renders/table/macro/oak.webp" alt="" loading="lazy" decoding="async" width="1400" height="900"></a>
      </div>
      <div class="row-links"><a class="btn btn--line" href="materials/" data-s="mat.cta"></a></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap wrap--narrow">
      <div class="section__head"><p class="eyebrow-line" data-s="faq.eyebrow"></p><h2 data-s="faq.title"></h2></div>
      <div class="faq">
        <details><summary data-s="q.1"></summary><p class="faq__a" data-s="a.1"></p></details>
        <details><summary data-s="q.2"></summary><p class="faq__a" data-s="a.2"></p></details>
        <details><summary data-s="q.3"></summary><p class="faq__a" data-s="a.3"></p></details>
        <details><summary data-s="q.4"></summary><p class="faq__a" data-s="a.4"></p></details>
        <details><summary data-s="q.5"></summary><p class="faq__a" data-s="a.5"></p></details>
      </div>
      <div class="row-links"><a class="btn btn--line" href="help/#faq" data-s="faq.all"></a></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="band">
        <div><h2 data-s="band.title"></h2><p data-s="band.lead"></p></div>
        <a class="btn btn--solid" href="contact/" data-s="band.cta"></a>
      </div>
    </div>
  </section>

</div>

<footer class="site-foot" data-site-foot></footer>

<!-- the cloth up close: the chosen fabric rendered as a cushion's corner, and its tones -->
<div class="sheet" id="closeup" hidden>
  <div class="sheet__card sheet__card--look" role="dialog" aria-modal="true" aria-labelledby="closeup-title">
    <figure class="look-pic">
      <img id="closeup-img" alt="" width="1400" height="900">
      <img id="closeup-img2" alt="" width="1400" height="900" aria-hidden="true">
    </figure>
    <div class="look-text">
      <p class="eyebrow" id="closeup-type"></p>
      <h2 id="closeup-title"></h2>
      <p class="look-desc" id="closeup-desc"></p>
      <p class="look-label" id="closeup-row"></p>
      <div id="closeup-tones" class="swatches swatches--tones"></div>
    </div>
    <button type="button" class="sheet__close" data-close data-t-aria="t.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

<!-- two designs side by side: the one saved as A, and the one on the stage -->
<div class="sheet" id="comparer" hidden>
  <div class="sheet__card sheet__card--compare" role="dialog" aria-modal="true" aria-labelledby="compare-title">
    <div class="cmp-head">
      <p class="eyebrow" data-t="t.compare"></p>
      <h2 id="compare-title" data-t="c.title"></h2>
    </div>
    <div class="cmp-grid">
      <figure class="cmp" id="cmp-a">
        <div class="cmp-pic"><canvas></canvas><span class="cmp-tag">A</span></div>
        <figcaption>
          <span class="cmp-label" data-t="c.saved"></span>
          <span class="cmp-name"></span>
          <span class="cmp-spec"></span>
          <strong class="cmp-price"></strong>
        </figcaption>
      </figure>
      <figure class="cmp" id="cmp-b">
        <div class="cmp-pic"><canvas></canvas><span class="cmp-tag">B</span></div>
        <figcaption>
          <span class="cmp-label" data-t="c.current"></span>
          <span class="cmp-name"></span>
          <span class="cmp-spec"></span>
          <strong class="cmp-price"></strong>
        </figcaption>
      </figure>
    </div>
    <div class="cmp-foot">
      <p class="cmp-diff" id="cmp-diff"></p>
      <div class="cmp-actions">
        <button type="button" class="btn-line" id="cmp-keep" data-t="c.replace"></button>
        <button type="button" class="btn-solid" id="cmp-use" data-t="c.useA"></button>
      </div>
    </div>
    <button type="button" class="sheet__close" data-close data-t-aria="t.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

/* ══════════════════════════════════════════════════════════════════════════
   THE PIECE, RENDERED
   ══════════════════════════════════════════════════════════════════════════
   Every option is a photograph-grade render (Blender, Cycles), not a live
   model: the piece turns on a 72-step turntable under a fixed studio light,
   so the window's light slides over it as it would on a real one. Each option
   is its own layer, and the page stacks the ones chosen:
     empty studio × shadow   (multiply: the piece's shadow on that floor)
     upholstery + frame      (added: each was rendered holding the other out,
                              so together they cover exactly the piece)
     × cushions' shadow      (multiply: what the cushions do to the piece,
                              measured as the piece with them / without them)
     cushions                (over: lit with the piece there)
   Two sets: light frames (800 px, one pack per layer) while the piece moves,
   the full 1600 px frame once it rests. Frames are cropped to what they cover
   and decoded on demand within a memory budget, so a phone holds the piece's
   size, not 72 stage-sized images.
   The renders and the tooling that makes them: _film/config (build, render,
   pack).                                                                   */

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(screen.width, screen.height) < 700;
const saveData = !!(navigator.connection && navigator.connection.saveData);
/* bytes of decoded frames kept, per set: the light frames hold a whole turn of
   the chosen dress (~90 MB, ~125 with the cushion), the sharp ones a few rests —
   in one pool the sharp frames (10 MB an angle) pushed the warmed turn out */
const BUDGET = { lite: (small ? 84 : 160) * 1048576, hd: (small ? 24 : 56) * 1048576 };

/* a piece's form lives in a folder of its own: './renders/std', './renders/sofa/three' */
const dirOf = (P, s) => P.root + s.form.id;

const manifests = {}, manifestSync = {};
function manifestOf(dir) {
  return manifests[dir] || (manifests[dir] = fetch(dir + '/manifest.json')
    .then((r) => { if (!r.ok) throw new Error('manifest ' + dir); return r.json(); })
    .then((m) => (manifestSync[dir] = m))
    .catch((e) => { delete manifests[dir]; throw e; }));
}

/* decoded frames: the least recently used go first once over the budget */
const cache = new Map();
const cacheBytes = { lite: 0, hd: 0 };
const tierOf = (key) => key.slice(0, key.indexOf('|'));
function remember(key, bmp) {
  const bytes = bmp.width * bmp.height * 4, tier = tierOf(key);
  cache.set(key, { bmp, bytes }); cacheBytes[tier] += bytes;
  for (const [k, v] of cache) {
    if (cacheBytes[tier] <= BUDGET[tier]) break;
    if (k === key || tierOf(k) !== tier) continue;
    cache.delete(k); cacheBytes[tier] -= v.bytes;
    if (v.bmp.close) v.bmp.close();
  }
}
function recall(key) {
  const hit = cache.get(key);
  if (!hit) return null;
  cache.delete(key); cache.set(key, hit);           // touched: the newest again
  return hit.bmp;
}

/* a layer's light frames come in one pack: one request, then sliced */
const packs = new Map();
function packOf(dir, name) {
  const id = dir + '/' + name;
  if (!packs.has(id)) {
    const p = manifestOf(dir).then((m) => {
      const L = m.layers[name].lite;
      return fetch(dir + '/' + L.pack)
        .then((r) => { if (!r.ok) throw new Error(L.pack); return r.arrayBuffer(); })
        .then((buf) => {
          const out = []; let at = 0;
          for (const n of L.sizes) { out.push(new Blob([new Uint8Array(buf, at, n)], { type: 'image/webp' })); at += n; }
          return out;
        });
    });
    p.catch(() => packs.delete(id));                // a failed download may be tried again
    packs.set(id, p);
  }
  return packs.get(id);
}

const pending = new Map();
const keyFor = (tier, dir, name, i) => tier + '|' + dir + '|' + name + '|' + i;
function decode(tier, dir, name, i) {
  const key = keyFor(tier, dir, name, i);
  const have = recall(key);
  if (have) return Promise.resolve(have);
  if (pending.has(key)) return pending.get(key);
  const blob = tier === 'lite'
    ? packOf(dir, name).then((blobs) => blobs[i])
    : manifestOf(dir).then((m) => fetch(dir + '/' + m.layers[name].hd.dir + String(i + 1).padStart(2, '0') + '.webp'))
        .then((r) => { if (!r.ok) throw new Error(name + ' ' + i); return r.blob(); });
  const p = blob.then((b) => createImageBitmap(b)).then(
    (bmp) => { pending.delete(key); remember(key, bmp); return bmp; },
    (err) => { pending.delete(key); throw err; });
  pending.set(key, p);
  return p;
}

/* the empty studio: once per form and set */
const grounds = new Map();
function groundOf(tier, dir) {
  const id = tier + '|' + dir;
  if (!grounds.has(id)) {
    const p = manifestOf(dir)
      .then((m) => fetch(dir + '/' + m.bg0[tier]))
      .then((r) => { if (!r.ok) throw new Error('ground'); return r.blob(); })
      .then((b) => createImageBitmap(b))
      .then((bmp) => { grounds.set(id + '!', bmp); return bmp; });
    p.catch(() => grounds.delete(id));
    grounds.set(id, p);
  }
  return grounds.get(id);
}

/* a choice, as the renders name it: what to stack, and a key for it */
const selOf = (P = product, s = state) => ({
  P, dir: dirOf(P, s), fabric: s.fabric.id, frame: s.frame.id, pillow: s.pillow, pillowFabric: s.pillowFabric.id,
});
const shadowOf = (sel) => (sel.P.shadowOf ? sel.P.shadowOf(sel) : sel.pillow && sel.P.shadowWithPillow ? sel.P.shadowWithPillow : 'shadow');
const layersOf = (sel) => [shadowOf(sel), 'fab-' + sel.fabric, 'frm-' + sel.frame]
  .concat(sel.pillow ? ['pilsh', 'pil-' + sel.pillowFabric] : []);
const keyOf = (sel) => [sel.dir, sel.fabric, sel.frame, sel.pillow ? sel.pillowFabric : '-'].join('|');
const want = (tier, sel, i) => Promise.all([groundOf(tier, sel.dir)].concat(layersOf(sel).map((n) => decode(tier, sel.dir, n, i))));
const canCompose = (tier, sel, i) => grounds.has(tier + '|' + sel.dir + '!') && !!manifestSync[sel.dir]
  && layersOf(sel).every((n) => cache.has(keyFor(tier, sel.dir, n, i)));

/* stack one angle of a choice into a frame-sized canvas */
const frameCv = { lite: document.createElement('canvas'), hd: document.createElement('canvas') };
const pieceCv = document.createElement('canvas');
function compose(tier, sel, i, into) {
  if (!canCompose(tier, sel, i)) return null;
  const m = manifestSync[sel.dir];
  const [fw, fh] = m.tiers[tier];
  const c = into || frameCv[tier], b = pieceCv;
  if (c.width !== fw || c.height !== fh) { c.width = fw; c.height = fh; }
  if (b.width !== fw || b.height !== fh) { b.width = fw; b.height = fh; }
  const names = layersOf(sel);
  const put = (ctx, n) => {
    const k = m.layers[n][tier].boxes[i];
    ctx.drawImage(recall(keyFor(tier, sel.dir, n, i)), k[0], k[1], k[2], k[3]);
  };
  const g = c.getContext('2d'), h = b.getContext('2d');
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.drawImage(grounds.get(tier + '|' + sel.dir + '!'), 0, 0, fw, fh);
  g.globalCompositeOperation = 'multiply'; put(g, names[0]);
  if (sel.P.stack === 'over') {
    /* the table: the base, then the top over it */
    g.globalCompositeOperation = 'source-over'; put(g, names[2]); put(g, names[1]);
  } else {
    /* upholstery and frame each hold the other out: added, they are the whole piece */
    h.globalCompositeOperation = 'source-over'; h.clearRect(0, 0, fw, fh);
    h.globalCompositeOperation = 'lighter'; put(h, names[1]); put(h, names[2]);
    h.globalCompositeOperation = 'source-over';
    g.globalCompositeOperation = 'source-over'; g.drawImage(b, 0, 0);
  }
  if (names[3]) {
    g.globalCompositeOperation = 'multiply'; put(g, names[3]);     // the cushions' shadow on the piece
    g.globalCompositeOperation = 'source-over'; put(g, names[4]);  // the cushions
  }
  return c;
}

/* where the measuring box falls in each frame (dims_config.py) */
const dimsData = {}, dimsSync = {};
function dimsOf(dir) {
  return dimsData[dir] || (dimsData[dir] = fetch(dir + '/dims.json')
    .then((r) => { if (!r.ok) throw new Error('dims'); return r.json(); })
    .then((d) => (dimsSync[dir] = d))
    .catch((e) => { delete dimsData[dir]; throw e; }));
}

/* ── interface ─────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const els = {
  fabrics: $('fabrics'), types: $('fabric-types'), frames: $('frames'), forms: $('forms'),
  pillow: $('pillow'), pillowText: $('pillow-text'), pillowPrice: $('pillow-price'),
  pillowFabrics: $('pillow-fabrics'), pillowTypes: $('pillow-types'), pillowOptions: $('pillow-options'),
  vFabric: $('v-fabric'), vFrame: $('v-frame'), vForm: $('v-form'), vPillow: $('v-pillow'),
  hForm: $('h-form'), hFrame: $('h-frame'), hFabric: $('h-fabric'), extras: $('g-extras'), h1: $('h1'), lede: $('lede'), pairsNote: $('pairs-note'),
  price: $('price'), dims: $('dims'), lead: $('lead'), pairs: $('pairs'),
  measure: $('measure'), compare: $('compare'),
};
let targetPrice = priceOf(product, state);
let shownPrice = targetPrice;
/* the cloth tab open in each picker (the sofa's three): follows the chosen fabric */
const tabs = { body: state.fabric.type, pillow: state.pillowFabric.type };

function makeSwatch(item, src) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch';
  b.dataset.id = item.id;
  b.style.backgroundColor = item.hex;           // until the sample arrives, and if it never does
  b.style.backgroundImage = 'url(' + src + ')';
  return b;
}

/* The swatch's own label is written by the language pass, not at build time,
   so switching language does not have to rebuild the rows. */
function labelSwatches(container, items) {
  container.querySelectorAll('.swatch').forEach((b) => {
    const item = items.find((it) => it.id === b.dataset.id);
    if (!item) return;
    const extra = item.price ? ' · +' + formatPrice(item.price) : '';
    b.dataset.name = nameOf(item) + extra;
    b.setAttribute('aria-label', nameOf(item) + extra);
    b.title = nameOf(item) + extra;
  });
}

/* the chosen one in a row, by id: written from the state, never from the click */
function markRow(container, selector, id) {
  container.querySelectorAll(selector).forEach((b) => {
    const on = b.dataset.id === id;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}

/* a fabric picker: the cloth tabs (sofa) over the tones of the open one */
function buildFabricRow(rowEl, tabsEl, which, onPick) {
  const P = product;
  tabsEl.hidden = !P.types;
  tabsEl.innerHTML = '';
  if (P.types) {
    P.types.forEach((ty) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ftab'; b.setAttribute('role', 'tab'); b.dataset.id = ty;
      b.addEventListener('click', () => { tabs[which] = ty; fillTones(); refresh(); });
      tabsEl.appendChild(b);
    });
  }
  const fillTones = () => {
    rowEl.innerHTML = '';
    const items = P.types ? P.fabrics.filter((f) => f.type === tabs[which]) : P.fabrics;
    rowEl.classList.toggle('swatches--8', items.length === 8);
    items.forEach((item) => {
      const b = makeSwatch(item, P.fabricSwatch(item));
      b.addEventListener('click', () => onPick(item));
      rowEl.appendChild(b);
    });
  };
  fillTones();
  rowEl.fillTones = fillTones;
}

function buildPairs() {
  const P = product;
  els.pairs.innerHTML = '';
  P.pairs.forEach((pr, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pair';
    b.dataset.id = String(i);
    const img = document.createElement('img');
    img.className = 'pair-thumb';
    img.src = P.pairSrc(pr); img.alt = ''; img.width = img.height = 56; img.decoding = 'async';
    img.addEventListener('error', () => { img.style.visibility = 'hidden'; });   // the card's ground, not a broken-image icon
    const text = document.createElement('span');
    text.className = 'pair-text';
    const name = document.createElement('span');
    name.className = 'pair-name';
    const dots = document.createElement('span');
    dots.className = 'pair-dots';
    dots.setAttribute('aria-hidden', 'true');
    [[byId(P.fabrics, pr.fabric), P.fabricSwatch]].concat(pr.pillow ? [[byId(P.fabrics, pr.pillow), P.fabricSwatch]] : [], [[byId(P.frames, pr.frame), frameSwatch]]).forEach(([item, src]) => {
      const d = document.createElement('i');
      d.style.backgroundColor = item.hex;
      d.style.backgroundImage = 'url(' + src(item) + ')';
      dots.appendChild(d);
    });
    text.append(name, dots);
    b.append(img, text);
    b.addEventListener('click', () => {
      state.fabric = byId(P.fabrics, pr.fabric);
      state.frame = byId(P.frames, pr.frame);
      if (pr.pillow) { state.pillowFabric = byId(P.fabrics, pr.pillow); state.pillow = true; }
      tabs.body = state.fabric.type; tabs.pillow = state.pillowFabric.type;
      els.fabrics.fillTones(); els.pillowFabrics.fillTones();
      refresh(); changed();
    });
    els.pairs.appendChild(b);
  });
}

function buildForms() {
  const P = product;
  els.forms.innerHTML = '';
  els.forms.classList.toggle('pills--icons', !!P.forms[0].icon);
  P.forms.forEach((item) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill';
    b.dataset.id = item.id;
    if (item.icon) {
      b.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="' + item.icon + '"/></svg><span></span>';
    } else b.innerHTML = '<span></span>';
    b.addEventListener('click', () => {
      state.form = item;
      refresh(); changed();
    });
    els.forms.appendChild(b);
  });
}

function buildFrames() {
  els.frames.innerHTML = '';
  product.frames.forEach((item) => {
    const b = makeSwatch(item, frameSwatch(item));
    b.addEventListener('click', () => { state.frame = item; refresh(); changed(); });
    els.frames.appendChild(b);
  });
}

/* the whole panel, for the piece on the stage */
function buildPanel() {
  buildPairs();
  buildForms();
  buildFabricRow(els.fabrics, els.types, 'body', (item) => { state.fabric = item; refresh(); changed(); });
  buildFabricRow(els.pillowFabrics, els.pillowTypes, 'pillow', (item) => { state.pillowFabric = item; refresh(); changed(); });
  buildFrames();
}

els.pillow.addEventListener('change', () => {
  state.pillow = els.pillow.checked;
  refresh(); changed();
});

/* One function writes every piece of text that depends on either the state
   or the language, so the two can never disagree. */
function refresh() {
  const P = product;
  targetPrice = priceOf(P, state);

  els.h1.textContent = P.h1[lang];
  els.lede.textContent = P.lede[lang];
  els.hForm.textContent = P.formLabel[lang];
  els.hFrame.textContent = P.frameLabel[lang];
  els.hFabric.textContent = P.fabricLabel[lang];
  stage.dataset.ground = P.ground || 'dark';
  els.extras.hidden = !P.pillowPrice;
  if (P.pillowLabel) els.pillowText.textContent = P.pillowLabel[lang];
  els.pairsNote.textContent = P.pairsNote[lang];
  els.vFabric.textContent = fabricName(P, state.fabric);
  els.vFrame.textContent = nameOf(state.frame);
  els.vForm.textContent = nameOf(state.form);
  els.vPillow.textContent = fabricName(P, state.pillowFabric);
  els.dims.textContent = dimsText(state.form);
  els.lead.textContent = t('lead').replace('%d', P.lead).replace('%w', ruDays(P.lead));
  els.pillowPrice.textContent = '+' + formatPrice(P.pillowPrice);

  labelSwatches(els.fabrics, P.fabrics);
  labelSwatches(els.frames, P.frames);
  labelSwatches(els.pillowFabrics, P.fabrics);
  [[els.types, 'body'], [els.pillowTypes, 'pillow']].forEach(([el, which]) => {
    el.querySelectorAll('.ftab').forEach((b) => {
      const on = b.dataset.id === tabs[which];
      b.textContent = TYPES[b.dataset.id].name[lang];
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-selected', String(on));
      /* the chosen cloth's own tab carries a dot when another tab is open */
      b.classList.toggle('has-pick', b.dataset.id === (which === 'body' ? state.fabric : state.pillowFabric).type);
    });
  });

  markRow(els.fabrics, '.swatch', state.fabric.id);
  markRow(els.frames, '.swatch', state.frame.id);
  markRow(els.pillowFabrics, '.swatch', state.pillowFabric.id);
  markRow(els.forms, '.pill', state.form.id);
  els.pillow.checked = state.pillow;
  els.pillowOptions.hidden = !state.pillow;

  els.pairs.querySelectorAll('.pair').forEach((b) => {
    const pr = P.pairs[+b.dataset.id];
    const on = state.fabric.id === pr.fabric && state.frame.id === pr.frame
      && (pr.pillow ? state.pillow && state.pillowFabric.id === pr.pillow : !state.pillow);
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
    b.querySelector('.pair-name').textContent = nameOf(pr);
    const label = nameOf(pr) + ': ' + fabricName(P, byId(P.fabrics, pr.fabric)) + ', '
      + (pr.pillow ? t('pairs.cushion') + ' ' + fabricName(P, byId(P.fabrics, pr.pillow)).toLocaleLowerCase(lang) + ', ' : '') + nameOf(byId(P.frames, pr.frame));
    b.setAttribute('aria-label', label);
    b.title = label;
  });

  els.forms.querySelectorAll('.pill').forEach((b) => {
    const item = byId(P.forms, b.dataset.id);
    if (item) b.querySelector('span').textContent = nameOf(item);
  });
  document.querySelectorAll('.product').forEach((b) => {
    const on = b.dataset.product === P.id;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', String(on));
  });
  els.compare.classList.toggle('has-a', !!slotA);
  if (closeupOpen) fillCloseup();
  if (els.fav) els.fav.setAttribute('aria-pressed', String(store.favs.has(keyOf(selOf()))));
  renderDetails();
}

/* ── under the configurator: what the piece is, and will it go through the door ── */
function renderDetails() {
  const P = product, D = DETAILS[P.id], L = lang;
  $('d-title').textContent = P.h1[L];
  $('d-lead').textContent = P.lede[L];
  const rows = [[store.t('d.dims'), dimsText(state.form)]];
  if (D.seat) rows.push([store.t('d.seat'), D.seat[0] + ' · ' + D.seat[1] + (L === 'ru' ? ' см' : ' cm')]);
  rows.push([P.fabricLabel[L], fabricName(P, state.fabric)], [P.frameLabel[L], nameOf(state.frame)]);
  if (state.pillow && P.pillowLabel) rows.push([P.pillowLabel[L], fabricName(P, state.pillowFabric)]);
  for (const [k, v] of D.rows) rows.push([k[L], v[L]]);
  rows.push([store.t('d.lead'), store.t('cart.made').replace('%d', store.days(P.lead))]);
  const dl = $('d-specs'); dl.innerHTML = '';
  for (const [k, v] of rows) {
    const div = document.createElement('div'), dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; div.append(dt, dd); dl.appendChild(div);
  }
  fitCheck();
}
/* each part as it comes off the van must pass the door on its narrowest
   side, and stand up through the opening on its next (2 cm of clearance) */
function fitCheck() {
  const w = parseFloat($('fit-w').value), h = parseFloat($('fit-h').value);
  const out = $('fit-out'), say = (v, text) => { out.dataset.v = v; out.querySelector('span').textContent = text; };
  if (!(w > 0 && h > 0)) return say('', store.t('fit.ask'));
  let spare = Infinity;
  for (const part of DETAILS[product.id].parts[state.form.id]) {
    const [a, b] = [...part].sort((x, y) => x - y);
    spare = Math.min(spare, (w - 2) - a, (h - 2) - b);
  }
  const n = Math.floor(spare);
  if (spare < 0) say('no', store.t('fit.no'));
  else if (spare < 6) say('tight', store.t('fit.tight').replace('%d', n));
  else say('yes', store.t('fit.yes').replace('%d', n));
}
['fit-w', 'fit-h'].forEach((id) => $(id).addEventListener('input', fitCheck));
$('fit').addEventListener('submit', (e) => e.preventDefault());

function applyLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.title = t('title');
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', t('desc'));
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.tAria)); });
  document.querySelectorAll('[data-tip]').forEach((el) => {
    el.dataset.name = t(el.dataset.tip); el.setAttribute('aria-label', t(el.dataset.tip));
  });
  refresh();
  /* The price is written by the animation loop, which only repaints when the
     number is actually moving — a language change alters the formatting, not
     the value, so it has to be written once by hand. */
  els.price.textContent = formatPrice(shownPrice);
  if (compareOpen) fillCompare();
  wake();                                            // the dimension labels are drawn in the language too
}
store.onLang(applyLang);

/* the other piece: the panel is rebuilt for it, the stage dissolves over */
document.querySelectorAll('.product').forEach((b) => {
  b.addEventListener('click', () => {
    const P = PRODUCTS[b.dataset.product];
    if (!P || P === product) return;
    product = P; state = states[P.id];
    tabs.body = state.fabric.type; tabs.pillow = state.pillowFabric.type;
    buildPanel(); refresh();
    view.vel = 0; view.play = null; view.zoomTo = 1;
    switching = !!shown.sel && keyOf(selOf()) !== shown.sel;   // the next frame dissolves in, however long it takes to arrive
    changed();
  });
});

/* back to the first view: the shorter way round, and out of any zoom */
$('reset').addEventListener('click', () => {
  const S = product.steps;
  const a = ((view.angle % S) + S) % S;
  const to = view.angle - a + (a > S / 2 ? S : 0);
  view.vel = 0;
  if (Math.abs(to - view.angle) > 0.01) view.play = { from: view.angle, to, t0: performance.now(), dur: reducedMotion ? 1 : 900 };
  view.zoomTo = 1;
  wake();
});

/* the snapshot is the full render of the angle on screen, not the screen */
$('snapshot').addEventListener('click', () => {
  const sel = selOf(), i = idx(view.angle);
  want('hd', sel, i).then(() => {
    const c = document.createElement('canvas');
    if (!compose('hd', sel, i, c)) return;
    c.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.download = 'larisel-' + product.id + '-' + state.fabric.id + '-' + state.frame.id + '.png';
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(t('saved'));
    }, 'image/png');
  }, () => {});
});

/* ── dimensions ────────────────────────────────────────────────────────── */
let dimsOn = false, dimsAlpha = 0;
els.measure.addEventListener('click', () => {
  dimsOn = !dimsOn;
  els.measure.setAttribute('aria-pressed', String(dimsOn));
  els.measure.classList.toggle('is-on', dimsOn);
  if (dimsOn) dimsOf(dirOf(product, state)).then(wake, () => {});
  wake();
});

/* ── share: the design in a link ─────────────────────────────────────────── */
function linkOf() {
  const u = new URL(location.href.split('#')[0]);
  u.search = '';
  u.searchParams.set('p', product.id);
  u.searchParams.set('form', state.form.id);
  u.searchParams.set('fab', state.fabric.id);
  u.searchParams.set('leg', state.frame.id);
  if (state.pillow && product.pillowPrice) u.searchParams.set('cush', state.pillowFabric.id);
  u.searchParams.set('lang', lang);
  return u.toString();
}
$('share').addEventListener('click', () => {
  const url = linkOf();
  const title = product.h1[lang];
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    navigator.share({ title, url }).catch(() => {});
    return;
  }
  const done = () => toast(t('copied'));
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('', url));
  else prompt('', url);
});

/* ── compare: a saved design (A) against the one on the stage (B) ────────── */
let slotA = null, compareOpen = false;
const snapshotOf = () => ({ P: product, s: Object.assign({}, state), angle: idx(view.angle) });
els.compare.addEventListener('click', () => {
  if (!slotA) {
    slotA = snapshotOf();
    els.compare.classList.add('has-a');
    toast(t('savedA'));
    return;
  }
  openSheet('comparer');
});
function specOf(P, s) {
  return [nameOf(s.form), fabricName(P, s.fabric), nameOf(s.frame)].concat(s.pillow && P.pillowLabel ? [P.pillowLabel[lang] + ': ' + fabricName(P, s.pillowFabric)] : []).join(' · ');
}
function fillCompare() {
  const B = snapshotOf();
  [['cmp-a', slotA], ['cmp-b', B]].forEach(([id, d]) => {
    const fig = $(id);
    fig.querySelector('.cmp-name').textContent = d.P.h1[lang];
    fig.querySelector('.cmp-spec').textContent = specOf(d.P, d.s);
    fig.querySelector('.cmp-price').textContent = formatPrice(priceOf(d.P, d.s));
    const sel = selOf(d.P, d.s), i = d.P === product ? idx(view.angle) : d.angle;
    const cv = fig.querySelector('canvas');
    const tag = keyOf(sel) + '#' + i;
    cv.dataset.k = tag;
    const draw = () => cv.dataset.k === tag && compose('hd', sel, i, cv);
    if (!draw()) want('hd', sel, i).then(draw, () => {});
  });
  const diff = priceOf(B.P, B.s) - priceOf(slotA.P, slotA.s);
  $('cmp-diff').textContent = diff === 0 ? t('c.same') : t(diff > 0 ? 'c.more' : 'c.less').replace('%s', formatPrice(Math.abs(diff)));
}
$('cmp-use').addEventListener('click', () => {
  const A = slotA;
  slotA = snapshotOf();                               // what was on the stage is kept as A: nothing is lost
  if (A.P !== product) { product = A.P; view.vel = 0; view.play = null; }
  states[A.P.id] = Object.assign({}, A.s); state = states[A.P.id];
  switching = A.P !== slotA.P && !!shown.sel && keyOf(selOf()) !== shown.sel;   // the other piece dissolves in
  tabs.body = state.fabric.type; tabs.pillow = state.pillowFabric.type;
  buildPanel(); refresh(); changed();
  fillCompare();
});
$('cmp-keep').addEventListener('click', () => { slotA = snapshotOf(); fillCompare(); toast(t('savedA')); });

/* ── close-up: the cloth, near ───────────────────────────────────────────── */
let closeupOpen = false, shownMacro = '', macroLoaded = '';
$('closeup-open').addEventListener('click', () => openSheet('closeup'));
function fillCloseup() {
  const P = product, f = state.fabric;
  const ty = TYPES[f.type];
  $('closeup-type').textContent = ty.name[lang];
  $('closeup-title').textContent = nameOf(f);
  $('closeup-desc').textContent = ty.desc[lang];
  $('closeup-row').textContent = P.rowLabel[lang];
  const tones = $('closeup-tones');
  const items = P.types ? P.fabrics.filter((x) => x.type === f.type) : P.fabrics;
  const set = P.id + (P.types ? f.type : '');
  if (tones.dataset.set !== set) {
    tones.innerHTML = '';
    tones.dataset.set = set;
    items.forEach((item) => {
      const b = makeSwatch(item, P.fabricSwatch(item));
      b.addEventListener('click', () => { state.fabric = item; tabs.body = item.type; els.fabrics.fillTones(); refresh(); changed(); });
      tones.appendChild(b);
    });
  }
  labelSwatches(tones, items);
  markRow(tones, '.swatch', f.id);

  } else if (!view.dragging) {
    if (Math.abs(view.vel) > 0.6) {
      view.angle += view.vel * dt;
      view.vel *= Math.exp(-3.2 * dt);
      busy = true;
    } else {
      view.vel = 0;
      const to = Math.round(view.angle);
      if (Math.abs(to - view.angle) > 0.01) { view.angle += (to - view.angle) * smooth(14, dt); busy = true; }
      else view.angle = to;
    }
  } else busy = true;
  const moving = busy;
  if (moving) view.quietSince = now;

  view.zoom += (view.zoomTo - view.zoom) * smooth(10, dt);
  if (Math.abs(view.zoomTo - view.zoom) > 0.0005) busy = true; else view.zoom = view.zoomTo;

  /* the measuring lines fade in and out, and wait for their data */
  const dimsWant = dimsOn && !!dimsSync[dirOf(product, state)];
  const dTarget = dimsWant ? 1 : 0;
  if (Math.abs(dimsAlpha - dTarget) > 0.01) { dimsAlpha += (dTarget - dimsAlpha) * smooth(9, dt); busy = true; }
  else dimsAlpha = dTarget;
  if (dimsOn && !dimsSync[dirOf(product, state)]) dimsOf(dirOf(product, state)).then(wake, () => {});

  /* the price counts its way to the new total */
  if (Math.abs(shownPrice - targetPrice) > 1) {
    shownPrice += (targetPrice - shownPrice) * smooth(10, dt);
    els.price.textContent = formatPrice(shownPrice);
    busy = true;
  } else if (shownPrice !== targetPrice) {
    shownPrice = targetPrice;
    els.price.textContent = formatPrice(shownPrice);
  }

  /* the frame: sharp once the piece has rested for a moment, light while it moves */
  const sel = selOf(), sk = keyOf(sel), i = idx(view.angle);
  const rest = !moving && now - view.quietSince > 120;
  /* between two angles while it turns: the two either side, slid together */
  const base = Math.floor(view.angle), tFrac = view.angle - base;      // S: this piece's steps (above)
  const k0 = ((base % S) + S) % S, k1 = (k0 + 1) % S;
  if (warp && started) warp.load(sel.dir);
  const between = moving && warp && !reducedMotion && tFrac > 0.002 && tFrac < 0.998 && warp.ready(sel.dir);
  if (between) for (const j of [k0, k1]) if (!canCompose('lite', sel, j)) want('lite', sel, j).then(wake, () => {});
  /* ask only for what is missing: a resolved request wakes the loop, so asking
     for what is already here would keep an idle page drawing forever */
  if (!canCompose('lite', sel, i)) want('lite', sel, i).then(wake, () => {});
  if (rest && !canCompose('hd', sel, i)) want('hd', sel, i).then(wake, () => {});
  /* ahead of the turn: the next frames in its direction, light */
  const dir = view.vel < 0 || (view.play && view.play.to < view.play.from) ? -1 : 1;
  if (moving) {
    for (let k = 1; k <= 6; k++) {
      const j = idx(i + dir * k);
      for (const n of layersOf(sel)) decode('lite', sel.dir, n, j).catch(() => {});
    }
  }

  let tier = rest && canCompose('hd', sel, i) ? 'hd' : canCompose('lite', sel, i) ? 'lite' : (canCompose('hd', sel, i) ? 'hd' : null);
  const slide = between && canCompose('lite', sel, k0) && canCompose('lite', sel, k1) ? view.angle.toFixed(4) : null;
  if (slide !== null) tier = 'lite';
  if (tier) {
    const key = sk + '#' + (slide !== null ? '~' + slide : i) + '#' + tier;
    const zoomed = Math.abs(view.zoom - (shown.zoom || 1)) > 0.0005;
    const dimsMoved = Math.abs(dimsAlpha - (shown.dims || 0)) > 0.001;
    if (key !== shown.key || fade || zoomed || dimsMoved || shown.w !== canvas.width || shown.lang !== lang) {
      if (switching) { startFade(reducedMotion ? 0 : 620); switching = false; }        // the other piece dissolves in
      else if (shown.sel && shown.sel !== sk) startFade(reducedMotion ? 0 : 380);     // a new choice dissolves in
      else if (shown.sel === sk && shown.tier === 'lite' && tier === 'hd' && shown.i === i) startFade(220);   // sharpening, no pop
      else if (shown.sel === sk && shown.i !== i && !reducedMotion && slide === null && !shown.slid) {
        /* a step of the turn: as slow steps come (the end of a throw, the
           opening easing out) each 5-degree step ticked; a dissolve as long as
           the step itself smooths it, and at speed it is too short to see */
        const d = Math.min(110, (now - (shown.stepT || now)) * 0.9);
        if (d >= 16) startFade(d);                    // under a frame: nothing to dissolve (and 0 ms divided by zero)
      }
      const frame = (slide !== null && warp.draw(sel, sk, k0, k1, tFrac)) || compose(tier, sel, i);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      paint(frame);
      if (fade) {
        const p = Math.min(1, (now - fade.t0) / fade.dur);
        ctx.globalAlpha = 1 - ease(p); ctx.drawImage(fadeCv, 0, 0); ctx.globalAlpha = 1;
        if (p >= 1) fade = null; else busy = true;
      }
      const D = dimsSync[sel.dir];
      if (dimsAlpha > 0.005 && D) {
        /* the lines follow the piece between angles too */
        const c = slide !== null ? lerpPts(D.corners[k0], D.corners[k1], tFrac) : D.corners[i];
        const r = D.rim && (slide !== null ? lerpPts(D.rim[k0], D.rim[k1], tFrac) : D.rim[i]);
        drawDims(c, state.form, ease(Math.min(1, dimsAlpha)), r);
      }
      if (shown.i !== i) shown.stepT = now;
      Object.assign(shown, { key, sel: sk, tier, i, zoom: view.zoom, w: canvas.width, dims: dimsAlpha, lang, slid: slide !== null });
      if (!started) {
        started = true;
        document.body.classList.add('is-ready');
        intro();
      }
    }
  }
  /* waiting for the next piece's (or dress's) frames: a thin line says so */
  stage.classList.toggle('is-loading', started && shown.sel !== sk);
  /* keep drawing while something moves, or until the piece has rested long
     enough to ask for its sharp frame; a missing frame wakes the loop itself */
  return busy || (!moving && !rest);
}

/* Warm the turn: the light frames of the chosen dress decoded ahead, nearest
   angles first, three at a time, as many as the budget holds (all 72 on a
   desk). Decoding on demand was the turn's stutter: a 5-degree step asked for
   three to five fresh decodes, and a throw outran them. A new choice starts
   over from the angle on screen. */
let warmGen = 0;
function warm(sel, from) {
  const gen = ++warmGen;
  const S = sel.P.steps;
  return manifestOf(sel.dir).then((m) => {
    const names = layersOf(sel);
    const perAngle = names.reduce((sum, n) => sum + m.layers[n].lite.boxes.reduce((a, b) => a + b[2] * b[3] * 4, 0) / S, 0);
    const fit = Math.max(1, Math.min(S, Math.floor(BUDGET.lite * 0.85 / perAngle)));
    const wrap = (k) => ((k % S) + S) % S;
    const order = [wrap(from)];
    for (let d = 1; order.length < fit; d++) {
      order.push(wrap(from + d));
      if (order.length < fit) order.push(wrap(from - d));
    }
    let k = 0;
    const next = () => {
      if (gen !== warmGen || k >= order.length) return null;
      const i = order[k++];
      return Promise.all(names.map((n) => decode('lite', sel.dir, n, i))).then(next, next);
    };
    return Promise.all([next(), next(), next()]);
  });
}

function intro() {
  const sel = selOf(), P0 = product;
  /* the turn plays once every angle of it is decoded: started on the downloads
     alone, it outran the decodes and stuttered on a first visit */
  warm(sel, idx(view.angle)).then(() => {
    later(preload);
    if (product !== P0 || reducedMotion || document.body.classList.contains('is-turned')) return;
    view.play = { from: view.angle, to: view.angle + product.steps, t0: performance.now(), dur: 3600 };
    wake();
  }, () => {});
}
const later = (fn) => ('requestIdleCallback' in window ? requestIdleCallback(fn, { timeout: 2500 }) : setTimeout(fn, 1200));

/* Afterwards, quietly: the other pieces as they stand, then the light packs of
   every other option of this form, so a choice turns at once. Not on a phone or a saver connection — there a
   choice loads when it is made (~0.3-1 MB). */
let preloaded = '';
function preload() {
  if (small || saveData) return;
  const P = product, dir = dirOf(P, state);
  if (preloaded === dir) return;
  preloaded = dir;
  /* first the other pieces, as they stand (a few packs each), so a tab opens on a turning
     piece at once; then every option of this form */
  const jobs = [];
  for (const id in PRODUCTS) {
    const Q = PRODUCTS[id];
    if (Q === P) continue;
    const sel = selOf(Q, states[id]);
    jobs.push(() => groundOf('lite', sel.dir));
    layersOf(sel).forEach((n) => jobs.push(() => packOf(sel.dir, n)));
  }
  const fabs = P.types ? P.fabrics.filter((f) => f.type === state.fabric.type).concat(P.fabrics.filter((f) => f.type !== state.fabric.type)) : P.fabrics;
  fabs.map((f) => 'fab-' + f.id).concat(P.frames.map((f) => 'frm-' + f.id)).forEach((n) => jobs.push(() => packOf(dir, n)));
  let k = 0;
  const next = () => {
    if (k >= jobs.length || preloaded !== dir) return;
    jobs[k++]().then(() => later(next), () => later(next));
  };
  next();
}

function changed() {
  targetPrice = priceOf(product, state);
  if (started) { warm(selOf(), idx(view.angle)).catch(() => {}); later(preload); }   // the new dress, from the angle on screen
  if (dimsOn) dimsOf(dirOf(product, state)).catch(() => {});
  if (compareOpen) fillCompare();
  wake();
}

buildPanel();
applyLang(lang);
/* the first frame: the sharp one, before anything else */
manifestOf(dirOf(product, state)).then(() => want('hd', selOf(), 0)).then(wake, () => wake());
resize();
</script>
</body>
</html>
