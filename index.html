<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Larisel armchair — 3D product configurator</title>
<meta name="description" content="An interactive furniture configurator built with Three.js: choose the upholstery, the frame and the size, and watch the price recalculate in real time.">

<meta property="og:type" content="website">
<meta property="og:title" content="Larisel armchair — 3D product configurator">
<meta property="og:description" content="Build the chair for your room in real-time 3D. Upholstery, frame, size — live price.">

<link rel="preload" href="fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=3">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  <main id="stage" class="stage">
    <canvas id="scene"></canvas>

    <div class="stage-top">
      <div class="mark">
        <span class="mark__name">LARISEL</span>
        <span class="mark__sub" data-t="badge"></span>
      </div>

      <div class="lang" role="group" aria-label="Language">
        <button class="lang__btn" type="button" data-lang="en" aria-pressed="true">EN</button>
        <button class="lang__btn" type="button" data-lang="tr" aria-pressed="false">TR</button>
        <button class="lang__btn" type="button" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>

    <div class="stage-bottom">
      <div class="stage-bottom__left">
        <p id="dims" class="chip chip--mono"></p>
        <p class="hint">

          <span data-t="snapshot"></span>

        <div id="fabrics" class="swatches"></div>
      </section>

      <section class="group">
        <div class="group-head">
          <h2 data-t="g.frame"></h2>
          <span id="v-frame" class="group-value"></span>
        </div>

        <div class="group-head">

        <div id="pillow-options" class="pillow-options" hidden>

          <div id="pillow-fabrics" class="swatches"></div>

  </aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ══════════════════════════════════════════════════════════════════════════
   LANGUAGE
   ══════════════════════════════════════════════════════════════════════════
   English is the source and the default: the page is a portfolio piece for a
   global audience, and the first visit has to be readable by anyone. Turkish
   and Russian are a click away and the choice is remembered.

   Keys rather than the text-node swapping used elsewhere in the portfolio,
   because most of the visible strings here are produced in JS — swatch
   names, dimensions, the price, the toast. There is nothing in the HTML to
   match against until the script has run.                                  */

const LANGS = ['en', 'tr', 'ru'];
const LOCALE = { en: 'en-US', tr: 'tr-TR', ru: 'ru-RU' };
const STORE = 'larisel-lang';

const T = {
  en: {
    title: 'Larisel armchair — 3D product configurator',
    desc: 'An interactive furniture configurator built with Three.js: choose the upholstery, the frame and the size, and watch the price recalculate in real time.',
    badge: 'Demo project',
    hint: 'Drag to turn it',
    reset: 'Reset view',
    snapshot: 'Snapshot',
    eyebrow: '3D product configurator',
    h1: 'Larisel armchair',
    lede: 'Build the chair for your own room — the model and the price change as you go.',
    'g.fabric': 'Upholstery',
    'g.frame': 'Frame',
    'g.size': 'Size',
    'g.extras': 'Extras',
    'g.cushion': 'Cushion fabric',
    pillow: 'Scatter cushion',
    total: 'Total',
    lead: 'Made to order · %d days',
    cta: 'Request this build',
    saved: 'Image saved'
  },
  tr: {
    title: 'Larisel koltuk — 3B ürün yapılandırıcı',
    desc: 'Three.js ile yazılmış interaktif mobilya yapılandırıcı: kumaşı, gövdeyi ve ölçüyü seçin, fiyat anında yeniden hesaplansın.',
    badge: 'Demo proje',
    hint: 'Döndürmek için sürükleyin',
    reset: 'Görünümü sıfırla',
    snapshot: 'Görüntü al',
    eyebrow: '3B ürün yapılandırıcı',
    h1: 'Larisel koltuk',
    lede: 'Koltuğu kendi odanıza göre kurun — model ve fiyat anında değişir.',
    'g.fabric': 'Kumaş',
    'g.frame': 'Gövde',
    'g.size': 'Ölçü',
    'g.extras': 'Ek seçenekler',
    'g.cushion': 'Yastık kumaşı',
    pillow: 'Dekoratif yastık',
    total: 'Toplam',
    lead: 'Siparişe özel üretim · %d gün',
    cta: 'Bu yapılandırmayı iste',
    saved: 'Görüntü kaydedildi'
  },
  ru: {
    title: 'Кресло Larisel — 3D-конфигуратор',
    desc: 'Интерактивный 3D-конфигуратор мебели на Three.js: выбор ткани, каркаса и размера с пересчётом цены в реальном времени.',
    badge: 'Демо-проект',
    hint: 'Зажмите и потяните',
    reset: 'Сбросить вид',
    snapshot: 'Снимок',
    eyebrow: '3D-конфигуратор товара',
    h1: 'Кресло Larisel',
    lede: 'Соберите кресло под свой интерьер — модель и цена меняются сразу.',
    'g.fabric': 'Ткань',
    'g.frame': 'Каркас',
    'g.size': 'Размер',
    'g.extras': 'Дополнительно',
    'g.cushion': 'Ткань подушки',
    pillow: 'Декоративная подушка',
    total: 'Итого',
    lead: 'Срок изготовления · %d дней',
    cta: 'Запросить эту сборку',
    saved: 'Изображение сохранено'
  }
};

let lang = 'en';
try {
  const saved = localStorage.getItem(STORE);
  if (LANGS.indexOf(saved) !== -1) lang = saved;
} catch (e) { /* private mode: English it is */ }

/* ?lang=tr wins over the remembered choice, so a link can be sent in the
   language the recipient reads. */
const asked = new URLSearchParams(location.search).get('lang');
if (LANGS.indexOf(asked) !== -1) lang = asked;

const t = (key) => T[lang][key];

/* ══════════════════════════════════════════════════════════════════════════
   CATALOGUE AND PRICES — edit here
   ══════════════════════════════════════════════════════════════════════════
   Names are per language and live on the item, not in a parallel list: a
   colour and its three names can never drift apart if they are one object.
   Prices are in US dollars: the same demo goes to Turkish, Russian and
   international clients, and one currency across every piece of work reads
   as one studio. Only the
   grouping follows the reader's locale.                                    */

const PRICE_BASE = 1290;
const LEAD_TIME = 14;   // days

const FABRICS = [
  { id: 'sand',       hex: '#d8c3a5', price: 0,    name: { en: 'Sand',       tr: 'Kum',       ru: 'Песочный' } },
  { id: 'cream',      hex: '#e9e2d6', price: 0,    name: { en: 'Cream',      tr: 'Krem',      ru: 'Сливочный' } },
  { id: 'graphite',   hex: '#3c4045', price: 70, name: { en: 'Graphite',   tr: 'Grafit',    ru: 'Графит' } },
  { id: 'olive',      hex: '#5f6b4a', price: 70, name: { en: 'Olive',      tr: 'Zeytin',    ru: 'Олива' } },
  { id: 'terracotta', hex: '#a8553c', price: 95, name: { en: 'Terracotta', tr: 'Terakota',  ru: 'Терракота' } },
  { id: 'indigo',     hex: '#2f3f5c', price: 95, name: { en: 'Indigo',     tr: 'İndigo',    ru: 'Индиго' } },
];

const FRAMES = [
  { id: 'oak',    hex: '#b98b52', metalness: 0.00, roughness: 0.58, price: 0,
    name: { en: 'Oak',         tr: 'Meşe',        ru: 'Дуб' } },
  { id: 'walnut', hex: '#5b3a24', metalness: 0.00, roughness: 0.50, price: 110,
    name: { en: 'Walnut',      tr: 'Ceviz',       ru: 'Орех' } },
  { id: 'black',  hex: '#2a2c30', metalness: 0.70, roughness: 0.40, price: 160,
    name: { en: 'Black steel', tr: 'Siyah metal', ru: 'Чёрный металл' } },
  { id: 'brass',  hex: '#d4af37', metalness: 0.88, roughness: 0.30, price: 280,
    name: { en: 'Brass',       tr: 'Pirinç',      ru: 'Латунь' } },
];

/* XL changes the PROPORTIONS, not the overall scale: the chair gets visibly
   wider. In an empty scene a uniform enlargement is indistinguishable from
   the camera moving closer. */
const SIZES = [
  { id: 'std', scale: { x: 1.00, y: 1.00, z: 1.00 }, price: 0,
    name: { en: 'Standard', tr: 'Standart', ru: 'Стандарт' },
    dims: { en: 'W 78 × D 82 × H 74 cm', tr: 'G 78 × D 82 × Y 74 cm', ru: 'Ш 78 × Г 82 × В 74 см' } },
  { id: 'xl',  scale: { x: 1.18, y: 1.05, z: 1.07 }, price: 230,
    name: { en: 'XL', tr: 'XL', ru: 'XL' },
    dims: { en: 'W 92 × D 88 × H 78 cm', tr: 'G 92 × D 88 × Y 78 cm', ru: 'Ш 92 × Г 88 × В 78 см' } },
];

const PILLOW = { price: 90 };

const nameOf = (item) => item.name[lang];

function totalPrice(state) {
  return PRICE_BASE
    + state.fabric.price
    + state.frame.price
    + state.size.price
    + (state.pillow ? PILLOW.price : 0);
}

function formatPrice(value) {
  return '$' + new Intl.NumberFormat('en-US').format(Math.round(value));
}

/* ══════════════════════════════════════════════════════════════════════════
   THE CHAIR
   ══════════════════════════════════════════════════════════════════════════
   Built procedurally: no external 3D files, so the page opens instantly.
   All dimensions in metres. Seat height 46 cm, overall height ~78 cm.      */

const W = 0.74;         // width
const D = 0.72;         // depth
const LEG_H = 0.30;
const RAIL_Y = 0.315;   // rail under the seat cushion
const SEAT_Y = 0.400;   // centre of the seat cushion
const SEAT_H = 0.130;
const ARM_Y = 0.625;

function shadowed(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function buildChair() {
  const root = new THREE.Group();

  const fabric = new THREE.MeshPhysicalMaterial({
    color: 0xd8c3a5,
    roughness: 0.95,
    metalness: 0.0,
    sheen: 0.30,
    sheenRoughness: 0.9,
    sheenColor: new THREE.Color(0xf4f0ea),
    envMapIntensity: 0.42,
  });

  const frame = new THREE.MeshStandardMaterial({
    color: 0xb98b52,
    roughness: 0.58,
    metalness: 0.0,
    envMapIntensity: 1.4,
  });

  const pillowMat = new THREE.MeshPhysicalMaterial({
    color: 0xa8553c,
    roughness: 0.9,
    metalness: 0.0,
    sheen: 0.35,
    sheenRoughness: 0.85,
    envMapIntensity: 0.55,
    transparent: true,
    opacity: 0,
  });

  // --- rail: the wooden base under the cushion -----------------------------
  const rail = shadowed(new THREE.Mesh(
    new RoundedBoxGeometry(W + 0.02, 0.055, D + 0.02, 4, 0.018),
    frame
  ));
  rail.position.y = RAIL_Y;
  root.add(rail);

  // --- seat cushion --------------------------------------------------------
  const seat = shadowed(new THREE.Mesh(
    new RoundedBoxGeometry(W - 0.02, SEAT_H, D - 0.03, 7, 0.05),
    fabric
  ));
  seat.position.y = SEAT_Y;
  root.add(seat);

  // --- back: sunk into the cushion, raked ~11° ------------------------------
  const backPivot = new THREE.Group();
  backPivot.position.set(0, SEAT_Y - 0.02, -D / 2 + 0.10);
  backPivot.rotation.x = -0.20;
  const back = shadowed(new THREE.Mesh(
    new RoundedBoxGeometry(W - 0.02, 0.42, 0.14, 7, 0.048),
    fabric
  ));
  back.position.y = 0.20;
  backPivot.add(back);
  root.add(backPivot);

  // --- arms: a soft pad on wooden posts -------------------------------------
  const postGeo = new THREE.CylinderGeometry(0.023, 0.021, ARM_Y - RAIL_Y, 16);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const post = shadowed(new THREE.Mesh(postGeo, frame));
      post.position.set(
        sx * (W / 2 + 0.015),
        RAIL_Y + (ARM_Y - RAIL_Y) / 2,
        sz * (D / 2 - 0.17)
      );
      root.add(post);
    }

    const pad = shadowed(new THREE.Mesh(
      new RoundedBoxGeometry(0.095, 0.085, D - 0.18, 5, 0.038),
      fabric
    ));
    pad.position.set(sx * (W / 2 + 0.015), ARM_Y + 0.015, 0.01);
    root.add(pad);
  }

  // --- legs: tapered, splayed slightly outwards -----------------------------
  const legGeo = new THREE.CylinderGeometry(0.028, 0.016, LEG_H, 20);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const leg = shadowed(new THREE.Mesh(legGeo, frame));
      leg.position.set(sx * (W / 2 - 0.09), LEG_H / 2 + 0.004, sz * (D / 2 - 0.10));
      leg.rotation.z = -sx * 0.11;
      leg.rotation.x = sz * 0.10;
      root.add(leg);
    }
  }

  // --- scatter cushion ------------------------------------------------------
  // A child of the back, so it inherits the rake and always sits propped
  // against it rather than lying flat in the middle of the seat.
  const pillow = shadowed(new THREE.Mesh(
    new RoundedBoxGeometry(0.34, 0.115, 0.34, 7, 0.052),
    pillowMat
  ));
  pillow.position.set(0.15, 0.21, 0.13);
  pillow.rotation.set(Math.PI / 2 - 0.30, 0.12, 0.14);
  pillow.visible = false;
  backPivot.add(pillow);

  return { root, fabric, frame, pillowMat, pillow };
}

/* ══════════════════════════════════════════════════════════════════════════
   SCENE, LIGHT, CONTROLS
   ══════════════════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('scene');
const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: true, preserveDrawingBuffer: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(1.58, 1.05, 2.05);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.48, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 4.2;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.50;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  document.body.classList.add('is-turned');   // the prompt has been followed
});

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xfffaf4, 1.65);
key.position.set(2.6, 4.2, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
key.shadow.bias = -0.0006;
const shadowCam = key.shadow.camera;
shadowCam.near = 0.5;
shadowCam.far = 12;
shadowCam.left = -2.2;
shadowCam.right = 2.2;
shadowCam.top = 2.2;
shadowCam.bottom = -2.2;
scene.add(key);

const rim = new THREE.DirectionalLight(0xeef2ff, 0.45);
rim.position.set(-3, 2.2, -2.4);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.30 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const chair = buildChair();
scene.add(chair.root);

/* ── state ─────────────────────────────────────────────────────────────── */
const state = {
  fabric: FABRICS[0], frame: FRAMES[0], size: SIZES[0],
  pillow: false, pillowFabric: FABRICS[4]
};

const target = {
  fabric: new THREE.Color(FABRICS[0].hex),
  frame: new THREE.Color(FRAMES[0].hex),
  pillow: new THREE.Color(FABRICS[4].hex),
  metalness: FRAMES[0].metalness,
  roughness: FRAMES[0].roughness,
  scale: new THREE.Vector3(1, 1, 1),
  opacity: 0,
  price: totalPrice(state),
};
let shownPrice = target.price;

chair.fabric.color.copy(target.fabric);
chair.frame.color.copy(target.frame);

/* ── interface ─────────────────────────────────────────────────────────── */
const els = {
  fabrics: document.getElementById('fabrics'),
  frames: document.getElementById('frames'),
  sizes: document.getElementById('sizes'),
  pillow: document.getElementById('pillow'),
  pillowPrice: document.getElementById('pillow-price'),
  vFabric: document.getElementById('v-fabric'),
  vFrame: document.getElementById('v-frame'),
  vSize: document.getElementById('v-size'),
  vPillow: document.getElementById('v-pillow'),
  price: document.getElementById('price'),
  dims: document.getElementById('dims'),
  lead: document.getElementById('lead'),
  toast: document.getElementById('toast'),
  pillowFabrics: document.getElementById('pillow-fabrics'),
  pillowOptions: document.getElementById('pillow-options'),
};

function makeSwatch(item, kind, isActive) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch' + (isActive ? ' is-active' : '');
  b.dataset.id = item.id;
  const dot = document.createElement('span');
  dot.className = 'swatch-dot';
  b.style.background = item.hex;
  if (kind === 'frame' && item.metalness > 0.5) dot.classList.add('is-metal');
  b.appendChild(dot);
  return b;
}

/* The swatch's own label is written by the language pass, not at build time,
   so switching language does not have to rebuild the rows. */
function labelSwatches(container, items) {
  const buttons = container.querySelectorAll('.swatch');
  items.forEach((item, i) => {
    const b = buttons[i];
    if (!b) return;
    const extra = item.price ? ' · +' + formatPrice(item.price) : '';
    b.dataset.name = nameOf(item) + extra;
    b.setAttribute('aria-label', nameOf(item) + extra);
    b.title = nameOf(item) + extra;
  });
}

function buildSwatchRow(container, items, kind, onPick, activeIndex = 0) {
  container.innerHTML = '';
  items.forEach((item, i) => {
    const b = makeSwatch(item, kind, i === activeIndex);
    b.addEventListener('click', () => {
      container.querySelectorAll('.swatch').forEach(s => s.classList.remove('is-active'));
      b.classList.add('is-active');
      onPick(item);
    });
    container.appendChild(b);
  });
}

buildSwatchRow(els.fabrics, FABRICS, 'fabric', item => {
  state.fabric = item;
  target.fabric.set(item.hex);
  refresh();
});

buildSwatchRow(els.frames, FRAMES, 'frame', item => {
  state.frame = item;
  target.frame.set(item.hex);
  target.metalness = item.metalness;
  target.roughness = item.roughness;
  refresh();
});

buildSwatchRow(els.pillowFabrics, FABRICS, 'fabric', item => {
  state.pillowFabric = item;
  target.pillow.set(item.hex);
  refresh();
}, 4);

SIZES.forEach((item, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'pill' + (i === 0 ? ' is-active' : '');
  b.dataset.id = item.id;
  b.addEventListener('click', () => {
    els.sizes.querySelectorAll('.pill').forEach(p => p.classList.remove('is-active'));
    b.classList.add('is-active');
    state.size = item;
    target.scale.set(item.scale.x, item.scale.y, item.scale.z);
    refresh();
  });
  els.sizes.appendChild(b);
});

els.pillow.addEventListener('change', () => {
  state.pillow = els.pillow.checked;
  target.opacity = state.pillow ? 1 : 0;
  if (state.pillow) chair.pillow.visible = true;
  els.pillowOptions.hidden = !state.pillow;
  refresh();
});

/* One function writes every piece of text that depends on either the state
   or the language, so the two can never disagree. */
function refresh() {
  target.price = totalPrice(state);

  els.vFabric.textContent = nameOf(state.fabric);
  els.vFrame.textContent = nameOf(state.frame);
  els.vSize.textContent = nameOf(state.size);
  els.vPillow.textContent = nameOf(state.pillowFabric);
  els.dims.textContent = state.size.dims[lang];
  els.lead.textContent = t('lead').replace('%d', LEAD_TIME);
  els.pillowPrice.textContent = '+' + formatPrice(PILLOW.price);

  labelSwatches(els.fabrics, FABRICS);
  labelSwatches(els.frames, FRAMES);
  labelSwatches(els.pillowFabrics, FABRICS);

  els.sizes.querySelectorAll('.pill').forEach((b) => {
    const item = SIZES.find(s => s.id === b.dataset.id);
    if (item) b.textContent = nameOf(item);
  });
}

function applyLang(next) {
  lang = next;
  document.documentElement.lang = next;
  document.title = t('title');
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', t('desc'));

  document.querySelectorAll('[data-t]').forEach((el) => {
    el.textContent = t(el.dataset.t);
  });

  document.querySelectorAll('[data-lang]').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.lang === next));
  });

  refresh();
  /* The price is written by the animation loop, which only repaints when the
     number is actually moving — a language change alters the formatting, not
     the value, so it has to be written once by hand. */
  els.price.textContent = formatPrice(shownPrice);

  try { localStorage.setItem(STORE, next); } catch (e) { /* private mode */ }
}

document.querySelectorAll('[data-lang]').forEach((b) => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

document.getElementById('reset').addEventListener('click', () => {
  controls.autoRotate = true;
  camera.position.set(1.58, 1.05, 2.05);
  controls.target.set(0, 0.48, 0);
});

document.getElementById('snapshot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'larisel-' + state.fabric.id + '-' + state.frame.id + '.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
  toast(t('saved'));
});

document.getElementById('order').addEventListener('click', () => {
  toast([nameOf(state.size), nameOf(state.fabric), nameOf(state.frame)].join(' · ')
        + ' — ' + formatPrice(target.price));
});

let toastTimer;
function toast(text) {
  els.toast.textContent = text;
  els.toast.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => els.toast.classList.remove('is-on'), 2800);
}

applyLang(lang);

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════════ */
function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
/* The stage can change size without the window ever resizing — a stylesheet
   arriving late, a mobile URL bar sliding away. Watching the element itself
   is the only reliable signal. */
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(stage);
resize();

const clock = new THREE.Clock();

/* Smoothing is tied to time, not to frames: the transition takes the same
   wall-clock time at 60 Hz, at 144 Hz, and on a laptop that is dropping
   frames. */
function smooth(rate, dt) {
  return 1 - Math.exp(-rate * dt);
}

function tick() {
  requestAnimationFrame(tick);

  const dt = Math.min(clock.getDelta(), 0.1);
  const k = smooth(9, dt);

  chair.fabric.color.lerp(target.fabric, k);
  chair.frame.color.lerp(target.frame, k);
  chair.pillowMat.color.lerp(target.pillow, k);
  chair.frame.metalness += (target.metalness - chair.frame.metalness) * k;
  chair.frame.roughness += (target.roughness - chair.frame.roughness) * k;

  chair.pillowMat.opacity += (target.opacity - chair.pillowMat.opacity) * smooth(11, dt);
  if (chair.pillowMat.opacity < 0.01 && target.opacity === 0) chair.pillow.visible = false;
  chair.pillow.scale.setScalar(0.62 + chair.pillowMat.opacity * 0.38);

  chair.root.scale.lerp(target.scale, smooth(8, dt));

  if (Math.abs(shownPrice - target.price) > 1) {
    shownPrice += (target.price - shownPrice) * smooth(10, dt);
    els.price.textContent = formatPrice(shownPrice);
  } else if (shownPrice !== target.price) {
    shownPrice = target.price;
    els.price.textContent = formatPrice(shownPrice);
  }

  controls.update();
  renderer.render(scene, camera);
}
tick();

document.body.classList.add('is-ready');
</script>
</body>
